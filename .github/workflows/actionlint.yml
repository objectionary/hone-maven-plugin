---
# yamllint disable rule:line-length
name: actionlint
'on':
  push:
    branches:
      - master
    paths:
      - '.github/**'
  pull_request:
    branches:
      - master
    paths:
      - '.github/**'
permissions: read-all
concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actionlint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1.80.0
        with:
          fail_level: error
