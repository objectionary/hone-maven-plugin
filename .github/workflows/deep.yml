---
# yamllint disable rule:line-length
name: deep
'on':
  push:
    branches:
      - master
    paths-ignore: [ 'README.md' ]
concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  start-instance:
    runs-on: ubuntu-26.04
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}
      - id: start
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          aws-resource-tags: '[{"Key":"Name","Value":"hone-deep"}]'
          github-token: ${{ secrets.AWS_PAT }}
          ec2-image-id: ${{ secrets.AWS_AMI }}
          ec2-instance-type: t3.2xlarge
          subnet-id: ${{ secrets.AWS_SUBNET }}
          security-group-id: ${{ secrets.AWS_SGROUP }}
  deep:
    needs: start-instance
    runs-on: ${{ needs.start-instance.outputs.label }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      # The EC2 AMI carries no Maven and actions/setup-java installs only a
      # JDK, so without this step every "mvn" below dies with "command not
      # found" and the whole job is red in under a second (see #813).
      - name: install-maven
        env:
          MAVEN_VERSION: 3.9.11
          # The SHA-512 Apache publishes next to the archive, pinned here so
          # that the digest is reviewed in this repo instead of fetched from
          # the same host that serves the bytes it vouches for.
          MAVEN_SHA512: bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
        run: |
          if command -v mvn > /dev/null; then
            mvn --version
            exit 0
          fi
          curl --silent --show-error --fail --location \
            --output /tmp/maven.tgz \
            "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  /tmp/maven.tgz" | sha512sum --check --strict
          mkdir -p "${HOME}/maven"
          tar xzf /tmp/maven.tgz --strip-components=1 --directory "${HOME}/maven"
          rm /tmp/maven.tgz
          echo "${HOME}/maven/bin" >> "${GITHUB_PATH}"
          "${HOME}/maven/bin/mvn" --version
      # The @DisabledWithoutPhino tests (82 phino rule packs and friends)
      # require phino of exactly the pinned version; without it they are
      # silently skipped and never run anywhere in CI (see #835). The EC2
      # AMI is not guaranteed to carry it, so install it here explicitly.
      #
      # The binary is the ubuntu-22.04 one, for the reason .github/install-phino.sh
      # already gives: the ubuntu-24.04 leg of phino's release workflow has been
      # failing since 0.0.116, so nothing is published there and the download
      # answers 403. This step kept asking for 24.04 after that script moved, so
      # wget exited 8, and because it is the step ahead of them BOTH `mvn -Pdeep`
      # steps were skipped — the deep suite has not run on master since.
      - name: install-phino
        run: |
          version=$(xargs < src/main/resources/org/eolang/hone/default-phino-version.txt)
          if ! phino --pin="${version}" --version > /dev/null 2>&1; then
            sudo wget -q -O /usr/bin/phino "http://phino.objectionary.com/releases/ubuntu-22.04/phino-${version}"
            sudo chmod +x /usr/bin/phino
          fi
          phino --pin="${version}" --version
      # A test that finds "phino" on the host runs "rewrite.sh" on the host
      # too, and that script refuses to rewrite in more than one thread
      # without GNU Parallel, by the decision of #409. The EC2 AMI doesn't
      # carry it, so ever since the step above started putting "phino" on the
      # PATH, 79 of those tests died with "parallel: command not found" and
      # the deep suite was never green (see #1042).
      - name: install-parallel
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v parallel > /dev/null; then
            sudo apt-get update --quiet
            sudo apt-get install --yes --no-install-recommends parallel
          fi
          parallel --version | head -1
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ubuntu-jdk-21-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ubuntu-jdk-21-maven-
      - run: mvn clean install -ntp --errors --batch-mode -Pdeep -Dinvoker.skip
      - run: mvn clean install -ntp --errors --batch-mode -DskipTests
  terminate-instance:
    needs:
      - start-instance
      - deep
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.AWS_PAT }}
          label: ${{ needs.start-instance.outputs.label }}
          ec2-instance-id: ${{ needs.start-instance.outputs.ec2-instance-id }}
  telegram:
    needs:
      - start-instance
      - deep
    runs-on: ubuntu-26.04
    if: ${{ failure() }}
    permissions:
      actions: read
    steps:
      - id: elapsed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          seconds=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[ .jobs[] | select(.completed_at) ]
              | (map(.completed_at | fromdate) | max) - (map(.started_at | fromdate) | min)
              | [ ., 0 ] | max')
          echo "This run took ${seconds} seconds"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Deep build of `${{ github.repository }}` just [failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in ${{ steps.elapsed.outputs.seconds }}s."
          disable_web_page_preview: true
          format: markdown
  recovered:
    needs:
      - start-instance
      - deep
    runs-on: ubuntu-26.04
    if: ${{ success() }}
    permissions:
      actions: read
    steps:
      - id: elapsed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          seconds=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[ .jobs[] | select(.completed_at) ]
              | (map(.completed_at | fromdate) | max) - (map(.started_at | fromdate) | min)
              | [ ., 0 ] | max')
          echo "This run took ${seconds} seconds"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
      - id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for _ in 1 2 3 4 5 6; do
            state=$(gh api "/repos/${{ github.repository }}/actions/workflows/deep.yml/runs?branch=${{ github.ref_name }}&per_page=100" \
              --jq 'if any(.workflow_runs[]; .id == ${{ github.run_id }})
                then [ .workflow_runs[]
                  | select(.id < ${{ github.run_id }})
                  | select(.conclusion == "failure" or .conclusion == "success") ][0].conclusion // "none"
                else "stale" end')
            [ "${state}" = 'stale' ] || break
            sleep 10
          done
          echo "The previous run of this workflow: ${state}"
          if [ "${state}" = 'failure' ]; then
            echo 'broken=yes' >> "${GITHUB_OUTPUT}"
          fi
      - if: ${{ steps.previous.outputs.broken == 'yes' }}
        uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🍓 Deep build of `${{ github.repository }}` just [recovered](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in ${{ steps.elapsed.outputs.seconds }}s."
          disable_web_page_preview: true
          format: markdown
