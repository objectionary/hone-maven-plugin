---
# yamllint disable rule:line-length
name: ort
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions: read-all
concurrency:
  group: ort-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ort:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oss-review-toolkit/ort-ci-github-action@v1
        with:
          fail-on: 'violations'
