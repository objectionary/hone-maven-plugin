---
# yamllint disable rule:line-length
name: qulice
'on':
  push:
    branches:
      - master
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/qulice.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/qulice.yml'
permissions: read-all
concurrency:
  group: qulice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qulice:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ubuntu-jdk-21-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ubuntu-jdk-21-maven-
      - run: mvn clean install -ntp --errors --batch-mode -DskipTests -Dinvoker.skip -Pqulice
