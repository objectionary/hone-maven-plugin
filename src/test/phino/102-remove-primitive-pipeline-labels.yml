---
# yamllint disable rule:line-length
# The same anchor between two operators of a primitive chain. The owner used to
# be the literal `java/util/stream/Stream`, so on IntStream, LongStream and
# DoubleStream the label survived and the chain fused into two distills instead
# of one (#1125).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/102-remove-pipeline-labels.phr
input: |
  ⟦
    body ↦ ⟦
      keep ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/IntStream", v1 ↦ "map", v2 ↦ "(Ljava/util/function/IntUnaryOperator;)Ljava/util/stream/IntStream;", v3 ↦ Φ.true ⟧,
      lbl ↦ ⟦ φ ↦ Φ.jeo.label, v0 ↦ "L42" ⟧,
      ln ↦ ⟦
        φ ↦ Φ.jeo.line-number,
        number ↦ 7,
        l0 ↦ ⟦ φ ↦ Φ.jeo.label, v0 ↦ "L42" ⟧
      ⟧,
      call ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/IntStream", v1 ↦ "distinct", v2 ↦ "()Ljava/util/stream/IntStream;", v3 ↦ Φ.true ⟧
    ⟧
  ⟧
expected:
  - ⟦ body ↦ ⟦ 𝜏-keep ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/IntStream", v1 ↦ "map", 𝐵-k ⟧, 𝜏-call ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/IntStream", v1 ↦ "distinct", 𝐵-c ⟧ ⟧ ⟧
