---
# yamllint disable rule:line-length
# The shape #1116 found in mybatis-dynamic-sql: a static method reference
# inside an INTERFACE (there `Utilities.filterNulls` calling
# `filter(Objects::nonNull)`). The `lambda$hone$104…` wrapper is added to the
# interface itself, so the handle the invokedynamic is repointed at must be an
# InterfaceMethodref; with the interface flag hardcoded to false the JVM threw
# IncompatibleClassChangeError "must be InterfaceMethodref constant" on the
# first call. The flag is now taken from the class's `interface` modifier.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/104-static-methodref-to-lambda.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    version ↦ 61,
    access ↦ 1537,
    modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, public ↦ Φ.true, interface ↦ Φ.true, abstract ↦ Φ.true, ρ ↦ ∅ ⟧,
    name ↦ "Foo",
    supername ↦ "java/lang/Object",
    interfaces ↦ ⟦ φ ↦ Φ.jeo.interfaces, ρ ↦ ∅ ⟧,
    jm$main ↦ ⟦
      φ ↦ Φ.jeo.method,
      access ↦ 9,
      modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, static ↦ Φ.true, ρ ↦ ∅ ⟧,
      name ↦ "main",
      descriptor ↦ "([Ljava/lang/String;)V",
      signature ↦ "",
      exceptions ↦ ⟦ φ ↦ Φ.jeo.exceptions, ρ ↦ ∅ ⟧,
      maxs ↦ ⟦ φ ↦ Φ.jeo.maxs, m1 ↦ 4, m2 ↦ 3 ⟧,
      params ↦ ⟦ φ ↦ Φ.jeo.params, ρ ↦ ∅ ⟧,
      annotations ↦ ⟦ φ ↦ Φ.jeo.annotations, ρ ↦ ∅ ⟧,
      body ↦ ⟦
        op0 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokedynamic,
          v3 ↦ "apply",
          v4 ↦ "()Ljava/util/function/Function;",
          v5 ↦ ⟦
            φ ↦ Φ.jeo.handle,
            v6 ↦ 6,
            v7 ↦ "java/lang/invoke/LambdaMetafactory",
            v8 ↦ "metafactory",
            v9 ↦ "(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodHandle;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/CallSite;",
            v10 ↦ Φ.false,
            ρ ↦ ∅
          ⟧,
          v11 ↦ ⟦ φ ↦ Φ.jeo.type, v12 ↦ "(Ljava/lang/Object;)Ljava/lang/Object;", ρ ↦ ∅ ⟧,
          v13 ↦ ⟦
            φ ↦ Φ.jeo.handle,
            v14 ↦ 6,
            v15 ↦ "Foo",
            v16 ↦ "triple",
            v17 ↦ "(Ljava/lang/Long;)Ljava/lang/Long;",
            v18 ↦ Φ.false,
            ρ ↦ ∅
          ⟧,
          v19 ↦ ⟦ φ ↦ Φ.jeo.type, v21 ↦ "(Ljava/lang/Long;)Ljava/lang/Long;", ρ ↦ ∅ ⟧,
          ρ ↦ ∅
        ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          v24 ↦ "java/util/stream/Stream",
          v25 ↦ "map",
          v26 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;",
          v27 ↦ Φ.true,
          ρ ↦ ∅
        ⟧,
        ρ ↦ ∅
      ⟧,
      jt$tcb ↦ ⟦ φ ↦ Φ.jeo.trycatchblocks, ρ ↦ ∅ ⟧,
      local-variable-table ↦ ⟦ φ ↦ Φ.jeo.local-variable-table, ρ ↦ ∅ ⟧,
      ρ ↦ ∅
    ⟧,
    ρ ↦ ∅
  ⟧
expected:
  - ⟦ 𝐵-a, v13 ↦ ⟦ φ ↦ Φ.jeo.handle, v14 ↦ 6, v15 ↦ "Foo", v16 ↦ 𝑒-w, v17 ↦ "(Ljava/lang/Long;)Ljava/lang/Long;", v18 ↦ Φ.true, ρ ↦ ∅ ⟧, 𝐵-b ⟧
  - ⟦ 𝐵-c, w-load ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧, w-call ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, v0 ↦ "Foo", v1 ↦ "triple", v2 ↦ "(Ljava/lang/Long;)Ljava/lang/Long;", v3 ↦ Φ.false, origin ↦ Φ.true ⟧, 𝐵-d ⟧
