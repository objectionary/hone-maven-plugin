---
# yamllint disable rule:line-length
# The void case of #1053. `peek(X::traced)` over `static void traced(Long)` is a
# static method reference whose instantiated SAM type equals its target
# signature — `Consumer.accept` returns void, so both read `(Ljava/lang/Long;)V`
# — which is exactly the adaptation-free shape 104 exists for, and its `when`
# gates the argument without gating the return.
#
# The `𝑒-return-op` table had no `V` case, so the sed fell through, the meta kept
# the literal `V`, and `tau` was asked for an attribute by that name. phino
# answered "Couldn't parse given attribute ... unexpected 'V'" and took the WHOLE
# optimize goal down — not the one class, the whole build. `V` now maps to the
# bare `return`, and the wrapper comes out as `aload 0; invokestatic traced; return`
# with max-stack 1.
#
# 104 had no pack at all before this one, which is a large part of why the hole
# survived. `104-static-methodref-to-lambda` is the value-returning twin.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/104-static-methodref-to-lambda.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    version ↦ 61,
    access ↦ 33,
    modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, public ↦ Φ.true, interface ↦ Φ.false, ρ ↦ ∅ ⟧,
    name ↦ "Foo",
    supername ↦ "java/lang/Object",
    interfaces ↦ ⟦ φ ↦ Φ.jeo.interfaces, ρ ↦ ∅ ⟧,
    jm$main ↦ ⟦
      φ ↦ Φ.jeo.method,
      access ↦ 9,
      modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, static ↦ Φ.true, ρ ↦ ∅ ⟧,
      name ↦ "main",
      descriptor ↦ "([Ljava/lang/String;)V",
      signature ↦ "",
      exceptions ↦ ⟦ φ ↦ Φ.jeo.exceptions, ρ ↦ ∅ ⟧,
      maxs ↦ ⟦ φ ↦ Φ.jeo.maxs, m1 ↦ 4, m2 ↦ 3 ⟧,
      params ↦ ⟦ φ ↦ Φ.jeo.params, ρ ↦ ∅ ⟧,
      annotations ↦ ⟦ φ ↦ Φ.jeo.annotations, ρ ↦ ∅ ⟧,
      body ↦ ⟦
        op0 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokedynamic,
          v3 ↦ "accept",
          v4 ↦ "()Ljava/util/function/Consumer;",
          v5 ↦ ⟦
            φ ↦ Φ.jeo.handle,
            v6 ↦ 6,
            v7 ↦ "java/lang/invoke/LambdaMetafactory",
            v8 ↦ "metafactory",
            v9 ↦ "(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodHandle;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/CallSite;",
            v10 ↦ Φ.false,
            ρ ↦ ∅
          ⟧,
          v11 ↦ ⟦ φ ↦ Φ.jeo.type, v12 ↦ "(Ljava/lang/Object;)V", ρ ↦ ∅ ⟧,
          v13 ↦ ⟦
            φ ↦ Φ.jeo.handle,
            v14 ↦ 6,
            v15 ↦ "Foo",
            v16 ↦ "traced",
            v17 ↦ "(Ljava/lang/Long;)V",
            v18 ↦ Φ.false,
            ρ ↦ ∅
          ⟧,
          v19 ↦ ⟦ φ ↦ Φ.jeo.type, v21 ↦ "(Ljava/lang/Long;)V", ρ ↦ ∅ ⟧,
          ρ ↦ ∅
        ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          v24 ↦ "java/util/stream/Stream",
          v25 ↦ "peek",
          v26 ↦ "(Ljava/util/function/Consumer;)Ljava/util/stream/Stream;",
          v27 ↦ Φ.true,
          ρ ↦ ∅
        ⟧,
        ρ ↦ ∅
      ⟧,
      jt$tcb ↦ ⟦ φ ↦ Φ.jeo.trycatchblocks, ρ ↦ ∅ ⟧,
      local-variable-table ↦ ⟦ φ ↦ Φ.jeo.local-variable-table, ρ ↦ ∅ ⟧,
      ρ ↦ ∅
    ⟧,
    ρ ↦ ∅
  ⟧
expected:
  - ⟦ 𝐵-a, w-return ↦ ⟦ φ ↦ Φ.jeo.opcode.return ⟧, ρ ↦ ∅ ⟧
  - ⟦ 𝐵-b, w-load ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧, w-call ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, v0 ↦ "Foo", v1 ↦ "traced", v2 ↦ "(Ljava/lang/Long;)V", v3 ↦ Φ.false, origin ↦ Φ.true ⟧, 𝐵-c ⟧
  - ⟦ φ ↦ Φ.jeo.maxs, max-stack ↦ 1, max-locals ↦ 1 ⟧
  - ⟦ 𝐵-d, φ ↦ Φ.jeo.method, 𝐵-e, descriptor ↦ "(Ljava/lang/Long;)V", 𝐵-f ⟧
