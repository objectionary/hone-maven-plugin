---
# yamllint disable rule:line-length
# The ordinary, value-returning shape 104 was written for: a static method
# reference whose instantiated SAM type equals its target signature, desugared
# into a private-static `lambda$hone$104…` wrapper that forwards the argument and
# returns what the referenced method returned. 111 lifts the wrapper afterwards.
#
# The rule had no pack until #1053, which is a large part of why its
# `𝑒-return-op` table could lose a case without anything noticing. The void half
# is `104-static-methodref-to-lambda-void`.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/104-static-methodref-to-lambda.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    version ↦ 61,
    access ↦ 33,
    modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, public ↦ Φ.true, ρ ↦ ∅ ⟧,
    name ↦ "Foo",
    supername ↦ "java/lang/Object",
    interfaces ↦ ⟦ φ ↦ Φ.jeo.interfaces, ρ ↦ ∅ ⟧,
    jm$main ↦ ⟦
      φ ↦ Φ.jeo.method,
      access ↦ 9,
      modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, static ↦ Φ.true, ρ ↦ ∅ ⟧,
      name ↦ "main",
      descriptor ↦ "([Ljava/lang/String;)V",
      signature ↦ "",
      exceptions ↦ ⟦ φ ↦ Φ.jeo.exceptions, ρ ↦ ∅ ⟧,
      maxs ↦ ⟦ φ ↦ Φ.jeo.maxs, m1 ↦ 4, m2 ↦ 3 ⟧,
      params ↦ ⟦ φ ↦ Φ.jeo.params, ρ ↦ ∅ ⟧,
      annotations ↦ ⟦ φ ↦ Φ.jeo.annotations, ρ ↦ ∅ ⟧,
      body ↦ ⟦
        op0 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokedynamic,
          v3 ↦ "apply",
          v4 ↦ "()Ljava/util/function/Function;",
          v5 ↦ ⟦
            φ ↦ Φ.jeo.handle,
            v6 ↦ 6,
            v7 ↦ "java/lang/invoke/LambdaMetafactory",
            v8 ↦ "metafactory",
            v9 ↦ "(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodHandle;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/CallSite;",
            v10 ↦ Φ.false,
            ρ ↦ ∅
          ⟧,
          v11 ↦ ⟦ φ ↦ Φ.jeo.type, v12 ↦ "(Ljava/lang/Object;)Ljava/lang/Object;", ρ ↦ ∅ ⟧,
          v13 ↦ ⟦
            φ ↦ Φ.jeo.handle,
            v14 ↦ 6,
            v15 ↦ "Foo",
            v16 ↦ "triple",
            v17 ↦ "(Ljava/lang/Long;)Ljava/lang/Long;",
            v18 ↦ Φ.false,
            ρ ↦ ∅
          ⟧,
          v19 ↦ ⟦ φ ↦ Φ.jeo.type, v21 ↦ "(Ljava/lang/Long;)Ljava/lang/Long;", ρ ↦ ∅ ⟧,
          ρ ↦ ∅
        ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          v24 ↦ "java/util/stream/Stream",
          v25 ↦ "map",
          v26 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;",
          v27 ↦ Φ.true,
          ρ ↦ ∅
        ⟧,
        ρ ↦ ∅
      ⟧,
      jt$tcb ↦ ⟦ φ ↦ Φ.jeo.trycatchblocks, ρ ↦ ∅ ⟧,
      local-variable-table ↦ ⟦ φ ↦ Φ.jeo.local-variable-table, ρ ↦ ∅ ⟧,
      ρ ↦ ∅
    ⟧,
    ρ ↦ ∅
  ⟧
expected:
  - ⟦ 𝐵-a, w-return ↦ ⟦ φ ↦ Φ.jeo.opcode.areturn ⟧, ρ ↦ ∅ ⟧
  - ⟦ 𝐵-b, w-load ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧, w-call ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, v0 ↦ "Foo", v1 ↦ "triple", v2 ↦ "(Ljava/lang/Long;)Ljava/lang/Long;", v3 ↦ Φ.false, origin ↦ Φ.true ⟧, 𝐵-c ⟧
  - ⟦ φ ↦ Φ.jeo.maxs, max-stack ↦ 1, max-locals ↦ 1 ⟧
