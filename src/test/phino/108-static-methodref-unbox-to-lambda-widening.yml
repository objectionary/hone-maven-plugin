---
# yamllint disable rule:line-length
# A static method reference whose referenced method returns Integer where the
# SAM wants a long (T::widen feeding a mapToLong, instantiated to (String)J)
# needs `intValue()` AND an `i2l`, which 108 does not build. It must therefore
# be left alone: the eight-way pairing in its guard admits only a wrapper and
# that wrapper's OWN primitive, so `)Ljava/lang/Integer;` never pairs with
# `)J`. Were the pairing loosened to "any wrapper, any primitive", the wrapper
# would call java/lang/Integer.longValue, a method that does not exist, and the
# class would die at link time. The match asserts the target handle still points
# straight at T.widen with its original descriptor, i.e. nothing was desugared.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/108-static-methodref-unbox-to-lambda.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    version ↦ 68,
    access ↦ 33,
    modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, public ↦ Φ.true, interface ↦ Φ.false ⟧,
    name ↦ "T",
    supername ↦ "java/lang/Object",
    interfaces ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
    m ↦ ⟦
      φ ↦ Φ.jeo.method,
      access ↦ 9,
      modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, static ↦ Φ.true ⟧,
      name ↦ "m",
      descriptor ↦ "()V",
      signature ↦ "",
      exceptions ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      maxs ↦ ⟦ φ ↦ Φ.jeo.maxs, max-stack ↦ 2, max-locals ↦ 1 ⟧,
      params ↦ ⟦ φ ↦ Φ.jeo.params ⟧,
      annotations ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      body ↦ ⟦
        φ ↦ Φ.jeo.seq.of,
        d ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokedynamic,
          v0 ↦ "applyAsLong",
          v1 ↦ "()Ljava/util/function/ToLongFunction;",
          h2 ↦ ⟦ φ ↦ Φ.jeo.handle, v0 ↦ 6, v1 ↦ "java/lang/invoke/LambdaMetafactory", v2 ↦ "metafactory", v3 ↦ "(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodHandle;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/CallSite;", v4 ↦ Φ.false ⟧,
          t3 ↦ ⟦ φ ↦ Φ.jeo.type, v0 ↦ "(Ljava/lang/Object;)J" ⟧,
          h4 ↦ ⟦ φ ↦ Φ.jeo.handle, v0 ↦ 6, v1 ↦ "T", v2 ↦ "widen", v3 ↦ "(Ljava/lang/String;)Ljava/lang/Integer;", v4 ↦ Φ.false ⟧,
          t5 ↦ ⟦ φ ↦ Φ.jeo.type, v0 ↦ "(Ljava/lang/String;)J" ⟧
        ⟧,
        i ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", v1 ↦ "mapToLong", v2 ↦ "(Ljava/util/function/ToLongFunction;)Ljava/util/stream/LongStream;", v3 ↦ Φ.true ⟧
      ⟧,
      trycatchblocks ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      local-variable-table ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, φ ↦ Φ.jeo.handle, 𝐵-b, 𝜏-c ↦ "widen", 𝐵-d, 𝜏-e ↦ "(Ljava/lang/String;)Ljava/lang/Integer;", 𝐵-f ⟧
