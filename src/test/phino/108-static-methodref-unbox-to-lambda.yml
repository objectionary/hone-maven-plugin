---
# yamllint disable rule:line-length
# A static method reference whose referenced method returns a wrapper where the
# SAM wants the primitive (T::big, declared (Integer)Boolean, feeding a filter
# that instantiates Predicate to (Integer)Z) must be desugared into a lambda
# whose wrapper unboxes before ireturn. 104 declines it, because its guard
# demands the instantiated type and the target signature be equal, and they are
# not. 108 synthesises `aload 0; invokestatic T.big (…)Boolean;
# invokevirtual java/lang/Boolean.booleanValue ()Z; ireturn` and repoints the
# invokedynamic target handle at it. The first match asserts the wrapper carries
# the unboxing call; the second asserts the target handle now points at THIS
# class "T" with the instantiated descriptor (before the rule it pointed at
# "T" too, but with the wrapper-less "(Ljava/lang/Integer;)Ljava/lang/Boolean;").
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/108-static-methodref-unbox-to-lambda.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    version ↦ 68,
    access ↦ 33,
    modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, public ↦ Φ.true ⟧,
    name ↦ "T",
    supername ↦ "java/lang/Object",
    interfaces ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
    m ↦ ⟦
      φ ↦ Φ.jeo.method,
      access ↦ 9,
      modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, static ↦ Φ.true ⟧,
      name ↦ "m",
      descriptor ↦ "()V",
      signature ↦ "",
      exceptions ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      maxs ↦ ⟦ φ ↦ Φ.jeo.maxs, max-stack ↦ 2, max-locals ↦ 1 ⟧,
      params ↦ ⟦ φ ↦ Φ.jeo.params ⟧,
      annotations ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      body ↦ ⟦
        φ ↦ Φ.jeo.seq.of,
        d ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokedynamic,
          v0 ↦ "test",
          v1 ↦ "()Ljava/util/function/Predicate;",
          h2 ↦ ⟦ φ ↦ Φ.jeo.handle, v0 ↦ 6, v1 ↦ "java/lang/invoke/LambdaMetafactory", v2 ↦ "metafactory", v3 ↦ "(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodHandle;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/CallSite;", v4 ↦ Φ.false ⟧,
          t3 ↦ ⟦ φ ↦ Φ.jeo.type, v0 ↦ "(Ljava/lang/Object;)Z" ⟧,
          h4 ↦ ⟦ φ ↦ Φ.jeo.handle, v0 ↦ 6, v1 ↦ "T", v2 ↦ "big", v3 ↦ "(Ljava/lang/Integer;)Ljava/lang/Boolean;", v4 ↦ Φ.false ⟧,
          t5 ↦ ⟦ φ ↦ Φ.jeo.type, v0 ↦ "(Ljava/lang/Integer;)Z" ⟧
        ⟧,
        i ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", v1 ↦ "filter", v2 ↦ "(Ljava/util/function/Predicate;)Ljava/util/stream/Stream;", v3 ↦ Φ.true ⟧
      ⟧,
      trycatchblocks ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      local-variable-table ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-x, φ ↦ Φ.jeo.opcode.invokevirtual, 𝐵-y, 𝜏-m ↦ "booleanValue", 𝐵-z ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.jeo.handle, 𝐵-b, 𝜏-c ↦ "T", 𝐵-d, 𝜏-e ↦ "(Ljava/lang/Integer;)Z", 𝐵-f ⟧
