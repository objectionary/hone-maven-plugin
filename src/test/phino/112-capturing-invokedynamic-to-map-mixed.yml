---
# yamllint disable rule:line-length
# A MIXED multi-capture map invokedynamic (issue #668): the factory descriptor
# "(Ljava/util/Date;ILjava/lang/Integer;)L…Function;" carries a reference, an int
# and a second reference, pushed by the `aload 0; iload 1; aload 2` run in front
# of the indy, and the lambda$ target takes them in that order ahead of the
# element. Before #668 the interface guard was an `or` of "([IJD]+)" and a lone
# "(L…;)", so this descriptor matched NEITHER branch and the whole map stayed
# native; the single "(([IJD]|L[^;]+;)+)" capture alphabet admits it.
#
# All three codes land in `captures` in descriptor order, for 114 to peel off the
# right end one at a time. The capture classes are hostile on purpose:
# "java/util/Date" ends in a capital D and "java/lang/Integer" opens with a
# capital I, so a peel that scanned for a bare [IJD] would tear both names apart —
# 114's alternation takes a whole "L…;" descriptor as one token instead.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/112-capturing-invokedynamic-to-map.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    version ↦ 68,
    access ↦ 33,
    modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, static ↦ Φ.false ⟧,
    name ↦ "Foo",
    supername ↦ "java/lang/Object",
    interfaces ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
    m$run ↦ ⟦
      φ ↦ Φ.jeo.method,
      access ↦ 8,
      modifiers ↦ ⟦ φ ↦ Φ.jeo.modifiers, static ↦ Φ.true ⟧,
      name ↦ "run",
      descriptor ↦ "(Ljava/util/Date;ILjava/lang/Integer;)I",
      signature ↦ "",
      exceptions ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      maxs ↦ ⟦ φ ↦ Φ.jeo.maxs, m1 ↦ 6, m2 ↦ 4 ⟧,
      params ↦ ⟦ φ ↦ Φ.jeo.params ⟧,
      annotations ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      body ↦ ⟦
        i20 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧,
        i21 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 1 ⟧,
        i22 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 2 ⟧,
        i23 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokedynamic,
          v0 ↦ "apply",
          v1 ↦ "(Ljava/util/Date;ILjava/lang/Integer;)Ljava/util/function/Function;",
          h2 ↦ ⟦ φ ↦ Φ.jeo.handle, v0 ↦ 6, v1 ↦ "java/lang/invoke/LambdaMetafactory", v2 ↦ "metafactory", v3 ↦ "(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodHandle;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/CallSite;", v4 ↦ Φ.false ⟧,
          t3 ↦ ⟦ φ ↦ Φ.jeo.type, v0 ↦ "(Ljava/lang/Object;)Ljava/lang/Object;" ⟧,
          h4 ↦ ⟦ φ ↦ Φ.jeo.handle, v0 ↦ 6, v1 ↦ "Foo", v2 ↦ "lambda$run$0", v3 ↦ "(Ljava/util/Date;ILjava/lang/Integer;Ljava/lang/Integer;)Ljava/lang/Integer;", v4 ↦ Φ.false ⟧,
          t5 ↦ ⟦ φ ↦ Φ.jeo.type, v0 ↦ "(Ljava/lang/Integer;)Ljava/lang/Integer;" ⟧
        ⟧,
        i24 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", v1 ↦ "map", v2 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", v3 ↦ Φ.true ⟧
      ⟧,
      trycatchblocks ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧,
      local-variable-table ↦ ⟦ φ ↦ Φ.jeo.seq.of0 ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.c-map, state-acc ↦ ⟦⟧, body-acc ↦ ⟦⟧, 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.hone.c-map, 𝐵-rc-head, captures ↦ "Ljava/util/Date;ILjava/lang/Integer;", 𝐵-rc-tail ⟧
  - ⟦ φ ↦ Φ.hone.c-map, 𝐵-g, target ↦ ⟦ 𝐵-h, signature ↦ "(Ljava/util/Date;ILjava/lang/Integer;Ljava/lang/Integer;)Ljava/lang/Integer;", 𝐵-i ⟧, 𝐵-j ⟧
  - ⟦ 𝐵-k, 𝜏-p1 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧, 𝜏-p2 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 1 ⟧, 𝜏-p3 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 2 ⟧, 𝜏-cm ↦ ⟦ φ ↦ Φ.hone.c-map, 𝐵-l ⟧, 𝐵-m ⟧
  - ⟦ φ ↦ Φ.hone.c-map, 𝐵-n, bridge-input ↦ "Ljava/lang/Integer;", 𝐵-o ⟧
