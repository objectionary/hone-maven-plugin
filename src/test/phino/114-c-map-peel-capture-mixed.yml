---
# yamllint disable rule:line-length
# The case #668 is about: a MIXED capture run, gathered by ONE peel rule and then
# typed by the marker expansions. The input mimics 112's output for a map capturing
# an ArrayList, an int and a String — three pushes (`aload 0; iload 1; aload 2`)
# inline in front of a Φ.hone.c-map with two EMPTY accumulators and `captures`
# holding all three codes in descriptor order.
#
# This is the shape a per-type peel could NOT drain. phino gives each rule its own
# fixpoint and the plugin runs a single cycle over the rule list, so with a separate
# iload rule ahead of a separate aload rule the iload rule saw an aload in front of
# the pragma, declined, and never got a second turn: `aload 0` and `iload 1` were
# left on the stack in front of a pragma that no longer expected them, and the class
# died with a VerifyError. One rule for every type has no such ordering to get
# wrong — this pack runs at the plugin's own --max-cycles=1 and drains all three.
#
# Each peel PREPENDS and takes the LAST code off `captures`, so the accumulators
# come out in descriptor order and each capture carries its own type: state-acc
# appends the ArrayList raw (124 drops its box marker — a reference is already an
# Object), the int boxed through Integer.valueOf (123), then the String raw;
# body-acc fetches java/util/ArrayList, then java/lang/Integer plus its intValue
# unboxing (125), then java/lang/String (126). ArrayList is deliberate: a capital L
# inside a class name that a careless end-anchored match would split into "List".
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/114-c-map-peel-capture.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/123-cap-box-primitive.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/124-cap-box-reference.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/125-cap-fetch-primitive.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/126-cap-fetch-reference.phr
input: |
  ⟦
    body ↦ ⟦
      p ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", v1 ↦ "map", v2 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", v3 ↦ Φ.true ⟧,
      a0 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧,
      i1 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 1 ⟧,
      a2 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 2 ⟧,
      cm ↦ ⟦
        φ ↦ Φ.hone.c-map,
        state-acc ↦ ⟦⟧,
        body-acc ↦ ⟦⟧,
        captures ↦ "Ljava/util/ArrayList;ILjava/lang/String;",
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/Integer;",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$run$0", signature ↦ "(Ljava/util/ArrayList;ILjava/lang/String;Ljava/lang/Integer;)Ljava/lang/Integer;", is-interface ↦ Φ.false ⟧
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.c-map, state-acc ↦ ⟦ 𝜏-d1 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, 𝜏-l1 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧, 𝜏-a1 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/List", i3 ↦ "add", 𝐵-a1x ⟧, 𝜏-po1 ↦ ⟦ φ ↦ Φ.jeo.opcode.pop ⟧, 𝜏-d2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, 𝜏-l2 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 1 ⟧, 𝜏-b2 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "java/lang/Integer", i3 ↦ "valueOf", 𝐵-b2x ⟧, 𝐵-sr ⟧, 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.hone.c-map, 𝐵-f, state-acc ↦ ⟦ 𝐵-g, 𝜏-d3 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, 𝜏-l3 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 2 ⟧, 𝜏-a3 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/List", i3 ↦ "add", 𝐵-a3x ⟧, 𝜏-po3 ↦ ⟦ φ ↦ Φ.jeo.opcode.pop ⟧, ρ ↦ ∅ ⟧, 𝐵-h ⟧
  - ⟦ φ ↦ Φ.hone.c-map, 𝐵-a, body-acc ↦ ⟦ 𝜏-f1 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/util/ArrayList" ⟧, 𝜏-f2 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/lang/Integer" ⟧, 𝜏-iv ↦ ⟦ φ ↦ Φ.jeo.opcode.invokevirtual, i1 ↦ "java/lang/Integer", i2 ↦ "intValue", 𝐵-ivx ⟧, 𝜏-f3 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/lang/String" ⟧, ρ ↦ ∅ ⟧, 𝐵-c ⟧
  - ⟦ φ ↦ Φ.hone.c-map, 𝐵-d, captures ↦ "", 𝐵-e ⟧
  - ⟦ 𝐵-x, 𝜏-p ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", 𝐵-pr ⟧, 𝜏-cm ↦ ⟦ φ ↦ Φ.hone.c-map, 𝐵-cr ⟧, 𝐵-y ⟧
