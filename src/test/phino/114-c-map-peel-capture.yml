---
# yamllint disable rule:line-length
# 114 gathers the captures 112 left inline, and 123/125 expand the type markers it
# leaves behind. The input mimics 112's output for `map(n -> n + x + y)`: a
# Φ.hone.c-map with two EMPTY accumulators and `captures` reading "II", preceded by
# two iload pushes (x at v0=0, y at v0=1) and bounded on the left by the previous
# operator's invokeinterface.
#
# 114 peels right-to-left (y, then x) and PREPENDS, so state-acc ends up appending
# x THEN y (slot 0 = x) and body-acc gets two fetches in the same order. Each firing
# drops the last code off `captures`, so the field reads "" at the end and the rule
# stops there; no iload is left between the invokeinterface and the c-map — every
# capture has moved into the accumulators.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/114-c-map-peel-capture.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/123-cap-box-primitive.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/125-cap-fetch-primitive.phr
input: |
  ⟦
    body ↦ ⟦
      p ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", v1 ↦ "map", v2 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", v3 ↦ Φ.true ⟧,
      x ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 0 ⟧,
      y ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 1 ⟧,
      cm ↦ ⟦
        φ ↦ Φ.hone.c-map,
        state-acc ↦ ⟦⟧,
        body-acc ↦ ⟦⟧,
        captures ↦ "II",
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/Integer;",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$run$1", signature ↦ "(IILjava/lang/Integer;)Ljava/lang/Integer;", is-interface ↦ Φ.false ⟧
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.c-map, state-acc ↦ ⟦ 𝜏-d ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, 𝜏-l ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 0 ⟧, 𝜏-b ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "java/lang/Integer", i3 ↦ "valueOf", i4 ↦ "(I)Ljava/lang/Integer;", 𝐵-bx ⟧, 𝜏-a ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/List", i3 ↦ "add", 𝐵-ax ⟧, 𝜏-po ↦ ⟦ φ ↦ Φ.jeo.opcode.pop ⟧, 𝐵-sr ⟧, 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.hone.c-map, 𝐵-a, body-acc ↦ ⟦ 𝜏-f1 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/lang/Integer" ⟧, 𝜏-iv ↦ ⟦ φ ↦ Φ.jeo.opcode.invokevirtual, i1 ↦ "java/lang/Integer", i2 ↦ "intValue", i3 ↦ "()I", 𝐵-ivx ⟧, 𝜏-f2 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/lang/Integer" ⟧, 𝐵-br ⟧, 𝐵-c ⟧
  - ⟦ φ ↦ Φ.hone.c-map, 𝐵-d, captures ↦ "", 𝐵-e ⟧
  - ⟦ 𝐵-x, 𝜏-p ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", 𝐵-pr ⟧, 𝜏-cm ↦ ⟦ φ ↦ Φ.hone.c-map, 𝐵-cr ⟧, 𝐵-y ⟧
