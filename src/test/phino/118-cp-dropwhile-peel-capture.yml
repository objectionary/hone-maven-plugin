---
# yamllint disable rule:line-length
# One capture is peeled off a Φ.hone.cp-dropWhile and folded into the four
# accumulators: the append that puts it in the shared List, the fetch that
# reads it back, and the two `iinc` of the List cursor that pay for that fetch
# on the arm which skips it. Both pushes are peeled here, right-to-left, so the
# accumulators come out in left-to-right capture order and `captures` drains to
# "" — which is what stops the rule.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/118-cp-dropwhile-peel-capture.phr
input: |
  ⟦
    body ↦ ⟦
      p1 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, i1 ↦ 7 ⟧,
      p2 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, i1 ↦ 8 ⟧,
      op ↦ ⟦
        φ ↦ Φ.hone.cp-dropWhile,
        state-acc ↦ ⟦⟧,
        body-acc ↦ ⟦⟧,
        skip-acc ↦ ⟦⟧,
        undo-acc ↦ ⟦⟧,
        captures ↦ "ILjava/lang/String;",
        class ↦ "dw/X",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/Integer;",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 6,
          class ↦ "dw/X",
          method ↦ "lambda$pipe$0",
          signature ↦ "(ILjava/lang/String;Ljava/lang/Integer;)Z",
          is-interface ↦ Φ.false
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, φ ↦ Φ.hone.cp-dropWhile, 𝐵-b, captures ↦ "", 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.cp-dropWhile, 𝐵-b, body-acc ↦ ⟦ 𝜏-f1 ↦ ⟦ φ ↦ Φ.hone.cap-fetch, code ↦ "I" ⟧, 𝜏-f2 ↦ ⟦ φ ↦ Φ.hone.cap-fetch, code ↦ "Ljava/lang/String;" ⟧ ⟧, 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.cp-dropWhile, 𝐵-b, skip-acc ↦ ⟦ 𝜏-t1 ↦ ⟦ φ ↦ Φ.jeo.opcode.iinc, i1 ↦ 3, i2 ↦ 1 ⟧, 𝜏-t2 ↦ ⟦ φ ↦ Φ.jeo.opcode.iinc, i1 ↦ 3, i2 ↦ 1 ⟧ ⟧, 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.cp-dropWhile, 𝐵-b, undo-acc ↦ ⟦ 𝜏-u1 ↦ ⟦ φ ↦ Φ.jeo.opcode.iinc, i1 ↦ 3, i2 ↦ -1 ⟧, 𝜏-u2 ↦ ⟦ φ ↦ Φ.jeo.opcode.iinc, i1 ↦ 3, i2 ↦ -1 ⟧ ⟧, 𝐵-c ⟧
  - ⟦ 𝐵-a, 𝜏-load ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, i1 ↦ 7 ⟧, 𝐵-b, 𝜏-box ↦ ⟦ φ ↦ Φ.hone.cap-box, code ↦ "I" ⟧, 𝐵-c ⟧
