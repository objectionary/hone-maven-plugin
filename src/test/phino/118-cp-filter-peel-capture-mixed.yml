---
# yamllint disable rule:line-length
# The cp-filter mirror of 114-c-map-peel-capture-mixed (issue #668):
# `filter(n -> base.contains(n) && n > lo)` captures a List and an int, so 113
# leaves an `aload 0` and an `iload 1` inline in front of the pragma with `captures`
# reading "Ljava/util/List;I".
#
# One peel rule drains both, right-to-left, dropping the matching code off
# `captures` each time: the int first (123 boxes it through Integer.valueOf, 125
# fetches it back and unboxes with intValue), then the List (124 drops its box
# marker, 126 fetches it back with no unbox). state-acc and body-acc therefore read
# in descriptor order — List at slot 0, the boxed lo at slot 1 — which is the order
# the static lambda$ (List, int, Integer)Z wants them below the item. `captures` is
# drained to "" and no push is left in front of the pragma.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/118-cp-filter-peel-capture.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/123-cap-box-primitive.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/124-cap-box-reference.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/125-cap-fetch-primitive.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/126-cap-fetch-reference.phr
input: |
  ⟦
    body ↦ ⟦
      p ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", v1 ↦ "filter", v2 ↦ "(Ljava/util/function/Predicate;)Ljava/util/stream/Stream;", v3 ↦ Φ.true ⟧,
      a0 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧,
      i1 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 1 ⟧,
      cf ↦ ⟦
        φ ↦ Φ.hone.cp-filter,
        state-acc ↦ ⟦⟧,
        body-acc ↦ ⟦⟧,
        captures ↦ "Ljava/util/List;I",
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/Integer;",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$run$0", signature ↦ "(Ljava/util/List;ILjava/lang/Integer;)Z", is-interface ↦ Φ.false ⟧
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.cp-filter, state-acc ↦ ⟦ 𝜏-d1 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, 𝜏-l1 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧, 𝜏-a1 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/List", i3 ↦ "add", 𝐵-a1x ⟧, 𝜏-po1 ↦ ⟦ φ ↦ Φ.jeo.opcode.pop ⟧, 𝜏-d2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, 𝜏-l2 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 1 ⟧, 𝜏-b2 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "java/lang/Integer", i3 ↦ "valueOf", 𝐵-b2x ⟧, 𝐵-sr ⟧, 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.hone.cp-filter, 𝐵-a, body-acc ↦ ⟦ 𝜏-f1 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/util/List" ⟧, 𝜏-f2 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/lang/Integer" ⟧, 𝜏-iv ↦ ⟦ φ ↦ Φ.jeo.opcode.invokevirtual, i1 ↦ "java/lang/Integer", i2 ↦ "intValue", 𝐵-ivx ⟧, ρ ↦ ∅ ⟧, 𝐵-c ⟧
  - ⟦ φ ↦ Φ.hone.cp-filter, 𝐵-d, captures ↦ "", 𝐵-e ⟧
  - ⟦ 𝐵-x, 𝜏-p ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", 𝐵-pr ⟧, 𝜏-cf ↦ ⟦ φ ↦ Φ.hone.cp-filter, 𝐵-cr ⟧, 𝐵-y ⟧
