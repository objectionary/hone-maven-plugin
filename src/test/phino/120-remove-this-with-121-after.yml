---
# yamllint disable rule:line-length
# The two rules in the order the sort gives them: the `this` push must be gone
# before `121` flips the flag, or nothing ever removes it (#1126).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/120-remove-this-before-nonstatic-lambda.phr
  - src/main/resources/org/eolang/hone/rules/streams/1xx/121-nonstatic-lambda-to-static.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.jeo.opcode.aload,
        v1 ↦ 0
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.lambda,
        class ↦ "Foo",
        method ↦ "bar",
        interface ↦ "()Ljava/util/function/Function;",
        lambda-signature ↦ "(Ljava/lang/Object;)Ljava/lang/Object;",
        bridge-signature ↦ "(Ljava/lang/Object;)Ljava/lang/Object;",
        static ↦ "false",
        opcode ↦ Φ.jeo.opcode.invokestatic,
        target ↦ "x",
        stream ↦ "y"
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ body ↦ ⟦ 𝜏-only ↦ ⟦ φ ↦ Φ.hone.lambda, 𝐵 ⟧ ⟧ ⟧
