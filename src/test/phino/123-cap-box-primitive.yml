---
# yamllint disable rule:line-length
# 123 turns each Φ.hone.cap-box marker 114/118 left in a state-acc into the boxing
# call its type code names. The input carries all three primitive codes in one
# state-acc — an int, a long and a double append — plus a reference marker that
# this rule must NOT touch (124 owns that one).
#
# Nothing here depends on rule order or on where in the tree the markers sit: each
# is rewritten where it stands, and the rule's own fixpoint clears every primitive
# marker in the file. That is what lets the peel itself be a single order-free rule
# (issue #668).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/123-cap-box-primitive.phr
input: |
  ⟦
    state-acc ↦ ⟦
      d1 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
      l1 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 0 ⟧,
      b1 ↦ ⟦ φ ↦ Φ.hone.cap-box, code ↦ "I" ⟧,
      d2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
      l2 ↦ ⟦ φ ↦ Φ.jeo.opcode.lload, v0 ↦ 1 ⟧,
      b2 ↦ ⟦ φ ↦ Φ.hone.cap-box, code ↦ "J" ⟧,
      d3 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
      l3 ↦ ⟦ φ ↦ Φ.jeo.opcode.dload, v0 ↦ 3 ⟧,
      b3 ↦ ⟦ φ ↦ Φ.hone.cap-box, code ↦ "D" ⟧,
      d4 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
      l4 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 5 ⟧,
      b4 ↦ ⟦ φ ↦ Φ.hone.cap-box, code ↦ "Ljava/util/List;" ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-l ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 0 ⟧, 𝜏-b ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "java/lang/Integer", i3 ↦ "valueOf", i4 ↦ "(I)Ljava/lang/Integer;", i5 ↦ Φ.false ⟧, 𝐵-b ⟧
  - ⟦ 𝐵-c, 𝜏-l ↦ ⟦ φ ↦ Φ.jeo.opcode.lload, v0 ↦ 1 ⟧, 𝜏-b ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "java/lang/Long", i3 ↦ "valueOf", i4 ↦ "(J)Ljava/lang/Long;", i5 ↦ Φ.false ⟧, 𝐵-d ⟧
  - ⟦ 𝐵-e, 𝜏-l ↦ ⟦ φ ↦ Φ.jeo.opcode.dload, v0 ↦ 3 ⟧, 𝜏-b ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "java/lang/Double", i3 ↦ "valueOf", i4 ↦ "(D)Ljava/lang/Double;", i5 ↦ Φ.false ⟧, 𝐵-f ⟧
  - ⟦ 𝐵-g, 𝜏-b4 ↦ ⟦ φ ↦ Φ.hone.cap-box, code ↦ "Ljava/util/List;" ⟧, 𝐵-h ⟧
