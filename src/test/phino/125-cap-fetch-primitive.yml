# yamllint disable rule:line-length
# 125 turns each Φ.hone.cap-fetch marker 114/118 left in a body-acc into the pair
# that reads a PRIMITIVE capture back out of the shared state List: a Φ.hone.fetch
# typed with the wrapper class, then the unboxing call that undoes 123's valueOf.
# All three primitive codes appear here; the reference marker belongs to 126 and
# must be left alone.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/125-cap-fetch-primitive.phr
input: |
  ⟦
    body-acc ↦ ⟦
      f1 ↦ ⟦ φ ↦ Φ.hone.cap-fetch, code ↦ "I" ⟧,
      f2 ↦ ⟦ φ ↦ Φ.hone.cap-fetch, code ↦ "J" ⟧,
      f3 ↦ ⟦ φ ↦ Φ.hone.cap-fetch, code ↦ "D" ⟧,
      f4 ↦ ⟦ φ ↦ Φ.hone.cap-fetch, code ↦ "Ljava/lang/String;" ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-f ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/lang/Integer" ⟧, 𝜏-u ↦ ⟦ φ ↦ Φ.jeo.opcode.invokevirtual, i1 ↦ "java/lang/Integer", i2 ↦ "intValue", i3 ↦ "()I", i4 ↦ Φ.false ⟧, 𝐵-b ⟧
  - ⟦ 𝐵-c, 𝜏-f ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/lang/Long" ⟧, 𝜏-u ↦ ⟦ φ ↦ Φ.jeo.opcode.invokevirtual, i1 ↦ "java/lang/Long", i2 ↦ "longValue", i3 ↦ "()J", i4 ↦ Φ.false ⟧, 𝐵-d ⟧
  - ⟦ 𝐵-e, 𝜏-f ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/lang/Double" ⟧, 𝜏-u ↦ ⟦ φ ↦ Φ.jeo.opcode.invokevirtual, i1 ↦ "java/lang/Double", i2 ↦ "doubleValue", i3 ↦ "()D", i4 ↦ Φ.false ⟧, 𝐵-f ⟧
  - ⟦ 𝐵-g, 𝜏-f4 ↦ ⟦ φ ↦ Φ.hone.cap-fetch, code ↦ "Ljava/lang/String;" ⟧, 𝐵-h ⟧
