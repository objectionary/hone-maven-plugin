---
# yamllint disable rule:line-length
# The stand-down half of 142 (#973). When 101 has stamped the `count()` —
# something ahead of it clears SIZED, so the JDK traverses regardless — fusing
# the map costs nothing and the guard must not fire.
#
# The input is the pack next door with one binding added to the terminal. The
# expectation is closed on the UNMARKED lambda, so it passes only while 142
# leaves that lambda completely alone.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/142-count-keeps-elidable-stage-native.phr
input: |
  ⟦
    body ↦ ⟦
      op-map ↦ ⟦
        φ ↦ Φ.hone.lambda,
        class ↦ "fusion/X",
        method ↦ "apply",
        interface ↦ "()Ljava/util/function/Function;",
        lambda-signature ↦ "(Ljava/lang/Object;)Ljava/lang/Object;",
        bridge-signature ↦ "(Ljava/lang/String;)Ljava/lang/Integer;",
        static ↦ "true",
        opcode ↦ "invokestatic",
        target ↦ ⟦ handle ↦ 6, class ↦ "fusion/X", method ↦ "lambda$main$0", signature ↦ "(Ljava/lang/String;)Ljava/lang/Integer;", is-interface ↦ Φ.false ⟧,
        stream ↦ ⟦ class ↦ "java/util/stream/Stream", method ↦ "map", signature ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;" ⟧
      ⟧,
      op-count ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        v0 ↦ "java/util/stream/Stream",
        v1 ↦ "count",
        v2 ↦ "()J",
        v3 ↦ Φ.true,
        traverses ↦ Φ.true
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.lambda, class ↦ "fusion/X", method ↦ "apply", interface ↦ "()Ljava/util/function/Function;", lambda-signature ↦ "(Ljava/lang/Object;)Ljava/lang/Object;", bridge-signature ↦ "(Ljava/lang/String;)Ljava/lang/Integer;", static ↦ "true", opcode ↦ "invokestatic", target ↦ 𝑒-t, stream ↦ 𝑒-s ⟧
