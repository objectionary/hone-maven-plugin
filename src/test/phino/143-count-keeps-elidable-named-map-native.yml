---
# yamllint disable rule:line-length
# The object-mapper half of the count() guard (#973, #635). 142 keeps a
# count-preserving stage native by stamping the Φ.hone.lambda 111 lifted out of
# it, and `map(new Loud())` has no lambda to stamp — so without 143 the elision
# that 101 and 142 protect is lost the moment 215 starts lifting object mappers,
# and `Stream.of(1, 2, 3).map(new Loud()).count()` goes from calling `apply`
# zero times to calling it three.
#
# The terminal here is unstamped, meaning 101 found nothing that clears SIZED,
# meaning the JDK answers `count()` from the spliterator and never runs the
# pipeline. So 143 stamps the `invokeinterface Stream.map` itself with
# `reverted ↦ Φ.true`; 215 is closed on the four-binding opcode and stops
# matching it, and the constructor run in front of it stays exactly where javac
# put it — which is what the second and third expectations pin.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/1xx/143-count-keeps-elidable-named-map-native.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦ φ ↦ Φ.jeo.opcode.new, v1 ↦ "Loud" ⟧,
      op2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
      op3 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokespecial, v2 ↦ "Loud", v3 ↦ "<init>", v4 ↦ "()V", v5 ↦ Φ.false ⟧,
      op4 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v6 ↦ "java/util/stream/Stream", v7 ↦ "map", v8 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", v9 ↦ Φ.true ⟧,
      op5 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v10 ↦ "java/util/stream/Stream", v11 ↦ "count", v12 ↦ "()J", v13 ↦ Φ.true ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v6 ↦ "java/util/stream/Stream", v7 ↦ "map", v8 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", v9 ↦ Φ.true, reverted ↦ Φ.true ⟧
  - ⟦ op1 ↦ ⟦ φ ↦ Φ.jeo.opcode.new, v1 ↦ "Loud" ⟧, op2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, op3 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokespecial, v2 ↦ "Loud", v3 ↦ "<init>", v4 ↦ "()V", v5 ↦ Φ.false ⟧, 𝐵-tail ⟧
  - ⟦ 𝐵-head, op5 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v10 ↦ "java/util/stream/Stream", v11 ↦ "count", v12 ↦ "()J", v13 ↦ Φ.true ⟧ ⟧
