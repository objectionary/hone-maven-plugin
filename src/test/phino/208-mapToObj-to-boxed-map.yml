---
# yamllint disable rule:line-length
# An `IntStream.mapToObj(...)` crossing from a primitive stream to a reference
# one is split into two pragmas that already exist: the Φ.hone.box of a boxed()
# and a plain Φ.hone.map carrying the original mapper. The map keeps the `int`
# its desugared lambda$ declares in `accepted` while its `bridge-input` names
# the Integer the box produces — the same mismatch 231 mints for a split
# primitive operator, and the one 241-244 and 421 resolve once the chain around
# the crossing has settled. The map lands on the reference side, so 281 gives it
# the dup a following filter needs, 306 folds it and 401 fuses it — no new
# emitter, and nothing downstream learns a new shape.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/208-mapToObj-to-boxed-map.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.lambda,
        class ↦ "A",
        method ↦ "apply",
        interface ↦ "()Ljava/util/function/IntFunction;",
        lambda-signature ↦ "(I)Ljava/lang/Object;",
        bridge-signature ↦ "(I)Ljava/lang/String;",
        static ↦ "true",
        opcode ↦ "invokestatic",
        target ↦ ⟦
          handle ↦ 6,
          class ↦ "A",
          method ↦ "lambda$main$0",
          signature ↦ "(I)Ljava/lang/String;",
          is-interface ↦ Φ.false
        ⟧,
        stream ↦ ⟦
          class ↦ "java/util/stream/IntStream",
          method ↦ "mapToObj",
          signature ↦ "(Ljava/util/function/IntFunction;)Ljava/util/stream/Stream;"
        ⟧
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-box ↦ ⟦ φ ↦ Φ.hone.box, stream-class ↦ "java/util/stream/IntStream", minted ↦ "crossing" ⟧, 𝜏-map ↦ ⟦ φ ↦ Φ.hone.map, 𝐵-b ⟧, 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.map, 𝐵-b, bridge-input ↦ "Ljava/lang/Integer;", bridge-output ↦ "Ljava/lang/String;", accepted ↦ "I", returned ↦ "Ljava/lang/String;", 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.map, 𝐵-b, target ↦ ⟦ 𝐵-c, method ↦ "lambda$main$0", signature ↦ "(I)Ljava/lang/String;", 𝐵-d ⟧, 𝐵-e ⟧
