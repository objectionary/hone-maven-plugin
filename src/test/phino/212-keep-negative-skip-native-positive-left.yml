  - src/main/resources/org/eolang/hone/rules/streams/2xx/220-recognize-skip.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    m1 ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        op0 ↦ ⟦ φ ↦ Φ.jeo.opcode.ldc, v0 ↦ ⟦ φ ↦ Φ.jeo.long, n0 ↦ 2 ⟧ ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/Stream",
          i3 ↦ "skip",
          i4 ↦ "(J)Ljava/util/stream/Stream;",
          i5 ↦ Φ.true
        ⟧
      ⟧
    ⟧
  ⟧
expected:
