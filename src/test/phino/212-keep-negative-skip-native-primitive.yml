---
# yamllint disable rule:line-length
# The primitive twin (#1081): an `IntStream.skip(-2L)` is not lifted by `212`.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/212-keep-negative-skip-native.phr
  - src/main/resources/org/eolang/hone/rules/streams/2xx/212-recognize-primitive-skip.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    m1 ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        op0 ↦ ⟦ φ ↦ Φ.jeo.opcode.ldc, v0 ↦ ⟦ φ ↦ Φ.jeo.long, n0 ↦ -2 ⟧ ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/IntStream",
          i3 ↦ "skip",
          i4 ↦ "(J)Ljava/util/stream/IntStream;",
          i5 ↦ Φ.true,
          ρ ↦ ∅
        ⟧,
        ρ ↦ ∅
      ⟧
    ⟧,
    ρ ↦ ∅
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, 𝐵-h, i3 ↦ "skip", 𝐵-t ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, 𝐵-h, reverted ↦ Φ.true, 𝐵-t ⟧
