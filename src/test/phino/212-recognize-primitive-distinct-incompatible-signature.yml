# yamllint disable rule:line-length
# Keep an incompatible method descriptor unchanged.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/212-recognize-primitive-distinct.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    m1 ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/IntStream",
          i3 ↦ "distinct",
          i4 ↦ "()V",
          i5 ↦ Φ.true
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - |
    ⟦
      φ ↦ Φ.jeo.class,
      name ↦ "Foo",
      m1 ↦ ⟦
        φ ↦ Φ.jeo.method,
        name ↦ "main",
        body ↦ ⟦
          op1 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokeinterface,
            i2 ↦ "java/util/stream/IntStream",
            i3 ↦ "distinct",
            i4 ↦ "()V",
            i5 ↦ Φ.true
          ⟧
        ⟧
      ⟧
    ⟧
