---
# yamllint disable rule:line-length
# An IntStream.distinct() becomes a Φ.hone.primitive-distinct pragma (#996),
# which 214 then wraps in the boxing sandwich 307 folds.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/212-recognize-primitive-distinct.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    m1 ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/IntStream",
          i3 ↦ "distinct",
          i4 ↦ "()Ljava/util/stream/IntStream;",
          i5 ↦ Φ.true
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦
      φ ↦ Φ.hone.primitive-distinct,
      class ↦ "Foo",
      stream-class ↦ "java/util/stream/IntStream"
    ⟧
