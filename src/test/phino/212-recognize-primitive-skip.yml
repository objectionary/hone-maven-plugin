---
# yamllint disable rule:line-length
# An IntStream.skip(n) becomes a Φ.hone.primitive-skip pragma carrying the
# long-constant push javac emits in front of the call, so 308 can bake it into
# the countdown and 442 recover it when reverting (#996).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/212-recognize-primitive-skip.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    m1 ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        op0 ↦ ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/IntStream",
          i3 ↦ "skip",
          i4 ↦ "(J)Ljava/util/stream/IntStream;",
          i5 ↦ Φ.true
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦
      φ ↦ Φ.hone.primitive-skip,
      class ↦ "Foo",
      stream-class ↦ "java/util/stream/IntStream",
      push ↦ ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧
    ⟧
