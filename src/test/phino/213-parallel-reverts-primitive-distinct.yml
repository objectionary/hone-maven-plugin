---
# yamllint disable rule:line-length
# A primitive distinct in a method that mentions parallel() goes back to the
# native IntStream call, stamped `reverted` so 212 cannot lift it again — and
# it goes back BEFORE 214 boxes anything, so the method ends up exactly what
# javac emitted rather than a native call marooned inside a boxing sandwich
# (#996).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/213-parallel-reverts-primitive-distinct.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        i2 ↦ "java/util/stream/IntStream",
        i3 ↦ "parallel",
        i4 ↦ "()Ljava/util/stream/IntStream;",
        i5 ↦ Φ.true
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.primitive-distinct,
        class ↦ "Foo",
        stream-class ↦ "java/util/stream/IntStream"
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦
      φ ↦ Φ.jeo.opcode.invokeinterface,
      i2 ↦ "java/util/stream/IntStream",
      i3 ↦ "distinct",
      i4 ↦ "()Ljava/util/stream/IntStream;",
      i5 ↦ Φ.true,
      reverted ↦ Φ.true
    ⟧
