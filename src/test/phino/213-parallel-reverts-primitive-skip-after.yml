---
# yamllint disable rule:line-length
# The parallel call AFTER the skip reverts it too, and the count push comes
# back out in front of the call in the order 212 absorbed it. Binding groups
# are order-preserving, which is why the two layouts need their own rules
# (#996).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/213-parallel-reverts-primitive-skip-after.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.primitive-skip,
        class ↦ "Foo",
        stream-class ↦ "java/util/stream/IntStream",
        push ↦ ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        i2 ↦ "java/util/stream/IntStream",
        i3 ↦ "parallel",
        i4 ↦ "()Ljava/util/stream/IntStream;",
        i5 ↦ Φ.true
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧
  - ⟦
      φ ↦ Φ.jeo.opcode.invokeinterface,
      i2 ↦ "java/util/stream/IntStream",
      i3 ↦ "skip",
      i4 ↦ "(J)Ljava/util/stream/IntStream;",
      i5 ↦ Φ.true,
      reverted ↦ Φ.true
    ⟧
