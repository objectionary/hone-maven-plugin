---
# yamllint disable rule:line-length
# The pragma 212 minted, wrapped in the boxing sandwich 211 builds for every
# primitive operation that carries a lambda, with the OBJECT pragma in the
# middle so 307 folds it unchanged (#996). The `skip` half keeps its push.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/214-box-unbox-primitive-stateful.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.primitive-distinct,
        class ↦ "Foo",
        stream-class ↦ "java/util/stream/IntStream"
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.primitive-skip,
        class ↦ "Foo",
        stream-class ↦ "java/util/stream/IntStream",
        push ↦ ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.box, stream-class ↦ "java/util/stream/IntStream", minted ↦ "sandwich" ⟧
  - ⟦
      φ ↦ Φ.hone.distinct,
      class ↦ "Foo",
      stream-class ↦ "java/util/stream/Stream"
    ⟧
  - ⟦
      φ ↦ Φ.hone.skip,
      class ↦ "Foo",
      stream-class ↦ "java/util/stream/Stream",
      push ↦ ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧
    ⟧
  - ⟦
      φ ↦ Φ.hone.unbox,
      opcode ↦ "invokevirtual",
      class ↦ "Foo",
      bridge-signature ↦ "(Ljava/lang/Integer;)I",
      static ↦ "true",
      target ↦ ⟦
        handle ↦ 5,
        class ↦ "java/lang/Integer",
        method ↦ "intValue",
        signature ↦ "()I",
        is-interface ↦ Φ.false
      ⟧
    ⟧
