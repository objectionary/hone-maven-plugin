---
# yamllint disable rule:line-length
# A `.filter(new P(flag ? 1 : 0))`: the constructor argument branches, so a
# frame sits between the `dup` and the `<init>`. The `new` is stamped
# `reverted`, which keeps `215-recognize-named-filter` from moving the run, and
# its frames, into the state block (#1225).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/215-decline-named-with-frames.phr
  - src/main/resources/org/eolang/hone/rules/streams/2xx/215-recognize-named-filter.phr
input: |
  ⟦
    j$X ↦ ⟦
      φ ↦ Φ.jeo.class,
      name ↦ "Foo",
      j$run ↦ ⟦
        φ ↦ Φ.jeo.method,
        name ↦ "run",
        body ↦ ⟦
          op1 ↦ ⟦ φ ↦ Φ.jeo.opcode.new, v0 ↦ "P" ⟧,
          op2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
          op3 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 0 ⟧,
          op4 ↦ ⟦ φ ↦ Φ.jeo.opcode.ifeq, l0 ↦ ⟦ φ ↦ Φ.jeo.label, v0 ↦ "L1" ⟧ ⟧,
          op5 ↦ ⟦ φ ↦ Φ.jeo.opcode.iconst_1 ⟧,
          op6 ↦ ⟦ φ ↦ Φ.jeo.opcode.goto, l0 ↦ ⟦ φ ↦ Φ.jeo.label, v0 ↦ "L2" ⟧ ⟧,
          op7 ↦ ⟦ φ ↦ Φ.jeo.label, v0 ↦ "L1" ⟧,
          op8 ↦ ⟦ φ ↦ Φ.jeo.frame, type ↦ 0 ⟧,
          op9 ↦ ⟦ φ ↦ Φ.jeo.opcode.iconst_0 ⟧,
          op10 ↦ ⟦ φ ↦ Φ.jeo.label, v0 ↦ "L2" ⟧,
          op11 ↦ ⟦ φ ↦ Φ.jeo.frame, type ↦ 0 ⟧,
          op12 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokespecial, v1 ↦ "P", v2 ↦ "<init>", v3 ↦ "(I)V", v4 ↦ Φ.false ⟧,
          op13 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v6 ↦ "java/util/stream/Stream", v7 ↦ "filter", v8 ↦ "(Ljava/util/function/Predicate;)Ljava/util/stream/Stream;", v9 ↦ Φ.true ⟧
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.new, 𝜏1 ↦ "P", reverted ↦ Φ.true ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, 𝜏6 ↦ "java/util/stream/Stream", 𝜏7 ↦ "filter", 𝐵-rest ⟧
