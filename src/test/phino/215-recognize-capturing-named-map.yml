---
# yamllint disable rule:line-length
# A `.map(new Scaler(2))` — the capturing constructor #1008 asks for. javac
# pushes the argument between the `dup` and the `invokespecial`, so the run is
# five opcodes rather than four and the descriptor is (I)V rather than ()V; both
# were pinned before, which is why this shape was invisible. 𝐵-args binds the
# push whole and the pragma carries it, together with the descriptor 317 needs
# to emit the same constructor call back. Nothing is peeled: unlike a capturing
# lambda's captures, a constructor argument is evaluated once.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/215-recognize-named-map.phr
input: |
  ⟦
    j$X ↦ ⟦
      φ ↦ Φ.jeo.class,
      name ↦ "Foo",
      j$main ↦ ⟦
        φ ↦ Φ.jeo.method,
        name ↦ "main",
        body ↦ ⟦
          op1 ↦ ⟦ φ ↦ Φ.jeo.opcode.new, v1 ↦ "Scaler" ⟧,
          op2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
          op3 ↦ ⟦ φ ↦ Φ.jeo.opcode.bipush, v0 ↦ "2" ⟧,
          op4 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokespecial, v2 ↦ "Scaler", v3 ↦ "<init>", v4 ↦ "(I)V", v5 ↦ Φ.false ⟧,
          op5 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v6 ↦ "java/util/stream/Stream", v7 ↦ "map", v8 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", v9 ↦ Φ.true ⟧,
          ρ ↦ ∅
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.named-map, 𝐵-before, object ↦ "Scaler", init ↦ "(I)V", 𝐵-after ⟧
  - ⟦ φ ↦ Φ.hone.named-map, 𝐵-a, args ↦ ⟦ 𝜏-push ↦ ⟦ φ ↦ Φ.jeo.opcode.bipush, 𝐵-p ⟧, ρ ↦ ∅ ⟧, 𝐵-b ⟧
  - ⟦ 𝜏-named ↦ ⟦ φ ↦ Φ.hone.named-map, 𝐵-rest ⟧, ρ ↦ ∅ ⟧
