---
# yamllint disable rule:line-length
# The case that used to stand the rule down (#1029). A constructor taking an
# int, a long and a double weighs six JVM slots, and the `when` guard #1008 put
# here refused anything past two: 502 bumps the caller's max-stack by a fixed 6,
# the append peaks at four cells with no arguments, so two more were said to fit
# and a third to overflow.
#
# The premise was wrong. The `new`/`dup`/args/`<init>` run is javac's own and
# stood at this very depth in the class jeo disassembled, so `max_stack` already
# covers `[.., stream, Foo, Foo, <args>]`; all 502's relocation adds is the two
# cells of the ArrayList beneath it, whatever the arguments weigh. So the guard
# is gone, and this pack pins the shape it used to refuse: the run is lifted, the
# pushes ride along inside `make`, and the descriptor comes through untouched.
#
# `named-objects.yml` carries the end-to-end half — `new Wide(a, b, c)` fuses
# and the class loads, where its method declared stack=8 and the fused prologue
# peaks at 10.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/215-recognize-named-map.phr
input: |
  ⟦
    j$X ↦ ⟦
      φ ↦ Φ.jeo.class,
      name ↦ "Foo",
      j$main ↦ ⟦
        φ ↦ Φ.jeo.method,
        name ↦ "main",
        body ↦ ⟦
          op1 ↦ ⟦ φ ↦ Φ.jeo.opcode.new, v1 ↦ "Wide" ⟧,
          op2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
          op3 ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, v0 ↦ 1 ⟧,
          op4 ↦ ⟦ φ ↦ Φ.jeo.opcode.lload, v0 ↦ 2 ⟧,
          op5 ↦ ⟦ φ ↦ Φ.jeo.opcode.dload, v0 ↦ 4 ⟧,
          op6 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokespecial, v2 ↦ "Wide", v3 ↦ "<init>", v4 ↦ "(IJD)V", v5 ↦ Φ.false ⟧,
          op7 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v6 ↦ "java/util/stream/Stream", v7 ↦ "map", v8 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", v9 ↦ Φ.true ⟧
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.named-map, class ↦ "Foo", make ↦ ⟦ 𝐵-make ⟧, bridge-input ↦ "Ljava/lang/Object;", bridge-output ↦ "Ljava/lang/Object;", accepted ↦ "Ljava/lang/Object;", returned ↦ "Ljava/lang/Object;", static ↦ "true" ⟧
  - ⟦ φ ↦ Φ.hone.named-map, 𝐵-a, make ↦ ⟦ 𝜏-new ↦ ⟦ φ ↦ Φ.jeo.opcode.new, i1 ↦ "Wide" ⟧, 𝐵-m, 𝜏-init ↦ ⟦ φ ↦ Φ.jeo.opcode.invokespecial, i2 ↦ "Wide", i3 ↦ "<init>", i4 ↦ "(IJD)V", i5 ↦ Φ.false ⟧ ⟧, 𝐵-b ⟧
  - ⟦ φ ↦ Φ.hone.named-map, 𝐵-c, make ↦ ⟦ 𝐵-m1, 𝜏-l ↦ ⟦ φ ↦ Φ.jeo.opcode.lload, v0 ↦ 2 ⟧, 𝐵-m2 ⟧, 𝐵-d ⟧
  - ⟦ 𝜏-named ↦ ⟦ φ ↦ Φ.hone.named-map, 𝐵-rest ⟧ ⟧
