---
# yamllint disable rule:line-length
# The other half of #969: a CONSTANT count is still lifted. jeo normalises
# javac's `ldc2_w` to `ldc`, so `lconst_0`, `lconst_1` and `ldc` are the three
# opcodes that can push a long on their own, and the guard admits exactly them.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/220-recognize-skip.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    m1 ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        op0 ↦ ⟦ φ ↦ Φ.jeo.opcode.ldc, i1 ↦ 2 ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/Stream",
          i3 ↦ "skip",
          i4 ↦ "(J)Ljava/util/stream/Stream;",
          i5 ↦ Φ.true
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦
      φ ↦ Φ.hone.skip,
      class ↦ "Foo",
      stream-class ↦ "java/util/stream/Stream",
      push ↦ ⟦ φ ↦ Φ.jeo.opcode.ldc, i1 ↦ 2 ⟧
    ⟧
