---
# yamllint disable rule:line-length
# The other half of #1016: a box the user WROTE is not cancelled. It carries no
# `synthetic` stamp — only 211, 214 and 208-mapToObj stamp the boxes they mint
# — so 221 declines and the pair survives as an unbox and a box, which 603 and
# 602 lower back into the `mapToInt(Wrapper::xValue)` and the `boxed()` the
# user's pipeline had. Cancelling here kept only the unbox, and the run then
# handed a `mapMultiToInt`'s IntStream to code holding a `Stream`.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/221-unbox-box-to-map.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.unbox,
        opcode ↦ "invokevirtual",
        class ↦ "A",
        bridge-signature ↦ "(Ljava/lang/Long;)J",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 5,
          class ↦ "java/lang/Long",
          method ↦ "longValue",
          signature ↦ "()J",
          is-interface ↦ Φ.false
        ⟧
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.box,
        stream-class ↦ "java/util/stream/LongStream"
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦
      φ ↦ Φ.hone.box,
      stream-class ↦ "java/util/stream/LongStream"
    ⟧
  - ⟦ 𝐵-a, 𝜏-u ↦ ⟦ φ ↦ Φ.hone.unbox, 𝐵-c ⟧, 𝜏-b ↦ ⟦ φ ↦ Φ.hone.box, 𝐵-d ⟧, 𝐵-b ⟧
