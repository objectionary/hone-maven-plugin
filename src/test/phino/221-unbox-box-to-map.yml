---
# yamllint disable rule:line-length
# 211 splits a primitive IntStream.filter/map chain into box + boxed-func +
# unbox; where two split ops meet, the tail unbox of one and the head box of
# the next are redundant and 221 collapses them back to a single object map.
# This pack exercises that collapse on a 211-style longValue pair. The box
# pattern is CLOSED and has no `user ↦ Φ.true` on it, which is how the rule
# keeps its hands off a `boxed()` the user wrote: 206 stamps that one and this
# pattern then stops matching it. 221 used to take any box at all, on the
# argument that by this point every pair left is 211's own — which was wrong,
# and #1016 is what it cost. `221-unbox-box-to-map-user-left` is the other
# half, and `221-unbox-user-box-to-map` the one user box still cancelled.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/221-unbox-box-to-map.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.unbox,
        opcode ↦ "invokevirtual",
        class ↦ "A",
        bridge-signature ↦ "(Ljava/lang/Long;)J",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 5,
          class ↦ "java/lang/Long",
          method ↦ "longValue",
          signature ↦ "()J",
          is-interface ↦ Φ.false
        ⟧
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.box,
        stream-class ↦ "java/util/stream/LongStream"
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, φ ↦ Φ.hone.map, 𝐵-b ⟧
