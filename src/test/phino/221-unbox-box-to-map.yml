---
# yamllint disable rule:line-length
# 211 splits a primitive IntStream.filter/map chain into box + boxed-func +
# unbox; where two split ops meet, the tail unbox of one and the head box of
# the next are redundant and 221 collapses them back to a single object map.
# This pack exercises that collapse on a 211-style longValue pair. The box
# carries `synthetic ↦ Φ.true`, the stamp 211, 214 and 208-mapToObj put on
# every box they mint, and 221 now requires it. It used to match any box at
# all, on the argument that by this point every pair left is 211's own — which
# was wrong: a user's `boxed()` written directly behind a lifted operation is
# still there, and cancelling against it dropped the boxing the user asked for
# (#1016). `221-unbox-box-to-map-user-left` is the other half.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/221-unbox-box-to-map.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.unbox,
        opcode ↦ "invokevirtual",
        class ↦ "A",
        bridge-signature ↦ "(Ljava/lang/Long;)J",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 5,
          class ↦ "java/lang/Long",
          method ↦ "longValue",
          signature ↦ "()J",
          is-interface ↦ Φ.false
        ⟧
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.box,
        stream-class ↦ "java/util/stream/LongStream",
        synthetic ↦ Φ.true
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, φ ↦ Φ.hone.map, 𝐵-b ⟧
