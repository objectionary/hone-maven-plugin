---
# yamllint disable rule:line-length
# Positional sibling of 226: a Φ.hone.dropWhile followed by `.parallel()` in
# the same method must be reverted the same way, with the predicate lambda
# rebuilt (carrying the `reverted` guard) so 310 never folds it into a
# parallel-unsound latch distill (#862).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/227-parallel-reverts-dropwhile-after.phr
input: |
  ⟦
    body ↦ ⟦
      op0 ↦ ⟦
        φ ↦ Φ.hone.dropWhile,
        opcode ↦ "invokestatic",
        class ↦ "fusion/X",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/Integer;",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 6,
          class ↦ "fusion/X",
          method ↦ "lambda$main$1",
          signature ↦ "(Ljava/lang/Integer;)Z",
          is-interface ↦ Φ.false
        ⟧
      ⟧,
      op1 ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        v0 ↦ "java/util/stream/Stream",
        v1 ↦ "parallel",
        v2 ↦ "()Ljava/util/stream/Stream;",
        v3 ↦ Φ.true
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.lambda, class ↦ "fusion/X", method ↦ "test", interface ↦ "()Ljava/util/function/Predicate;", lambda-signature ↦ "(Ljava/lang/Object;)Z", bridge-signature ↦ "(Ljava/lang/Integer;)Z", static ↦ "true", opcode ↦ "invokestatic", target ↦ ⟦ handle ↦ 6, class ↦ "fusion/X", method ↦ "lambda$main$1", signature ↦ "(Ljava/lang/Integer;)Z", is-interface ↦ Φ.false ⟧, stream ↦ ⟦ class ↦ "java/util/stream/Stream", method ↦ "dropWhile", signature ↦ "(Ljava/util/function/Predicate;)Ljava/util/stream/Stream;" ⟧, reverted ↦ Φ.true, 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, 𝐵-h, v1 ↦ "parallel", v2 ↦ "()Ljava/util/stream/Stream;", 𝐵-t ⟧