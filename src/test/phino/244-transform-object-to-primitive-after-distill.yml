---
# yamllint disable rule:line-length
# The boxing distill 209 folds a `mapToInt(lambda$).boxed()` round-trip into
# ends in an `Integer.valueOf`, so what it leaves is a wrapper. The map behind
# it here is the one 208 mints for an `IntStream.mapToObj(...)` crossing, whose
# target is a desugared lambda$ taking the raw `int`. Without the
# `Integer.intValue()` this rule splices between them, 401 would concatenate
# the two bodies and hand that mapper the Integer the valueOf had just made.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/244-transform-object-to-primitive-after-distill.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill,
        class ↦ "A",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/Integer;",
        start ↦ "map",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        state ↦ ⟦⟧,
        body ↦ ⟦
          b1 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "A",
            i3 ↦ "lambda$main$1",
            i4 ↦ "(Ljava/lang/Integer;)I",
            i5 ↦ Φ.false
          ⟧,
          b2 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "java/lang/Integer",
            i3 ↦ "valueOf",
            i4 ↦ "(I)Ljava/lang/Integer;",
            i5 ↦ Φ.false
          ⟧
        ⟧
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.map,
        opcode ↦ "invokestatic",
        class ↦ "A",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/String;",
        accepted ↦ "I",
        returned ↦ "Ljava/lang/String;",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 6,
          class ↦ "A",
          method ↦ "lambda$main$0",
          signature ↦ "(I)Ljava/lang/String;",
          is-interface ↦ Φ.false
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-distill ↦ ⟦ φ ↦ Φ.hone.distill, 𝐵-b ⟧, 𝜏-transform ↦ ⟦ φ ↦ Φ.hone.transform, 𝐵-c ⟧, 𝜏-map ↦ ⟦ φ ↦ Φ.hone.map, 𝐵-d ⟧, 𝐵-e ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.transform, opcode ↦ "invokevirtual", 𝐵-b, bridge-input ↦ "Ljava/lang/Integer;", bridge-output ↦ "Ljava/lang/Integer;", target ↦ ⟦ class ↦ "java/lang/Integer", method ↦ "intValue", signature ↦ "()I" ⟧, 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.map, 𝐵-b, accepted ↦ "I", returned ↦ "Ljava/lang/String;", 𝐵-c ⟧
