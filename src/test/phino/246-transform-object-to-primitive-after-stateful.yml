---
# yamllint disable rule:line-length
# The right-hand half of the same seam (#996): a distinct or a skip leaves a
# reference, a primitive filter behind it declares the raw `I` its desugared
# lambda$ takes. 243 and 261 mint the Wrapper.xValue() for that crossing when
# the predecessor is a typed pragma; these two are not, so it is minted from
# the SUCCESSOR's side — its bridge-input names the wrapper, its accepted the
# primitive.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/246-transform-object-to-primitive-after-stateful.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.skip,
        class ↦ "Foo",
        stream-class ↦ "java/util/stream/Stream",
        push ↦ ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.p-filter,
        opcode ↦ "invokestatic",
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/Integer;",
        accepted ↦ "I",
        returned ↦ "I",
        static ↦ "true",
        target ↦ ⟦ class ↦ "Foo", method ↦ "lambda$main$1", signature ↦ "(I)Z" ⟧
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦
      φ ↦ Φ.hone.transform,
      opcode ↦ "invokevirtual",
      class ↦ "Foo",
      bridge-input ↦ "Ljava/lang/Integer;",
      bridge-output ↦ "Ljava/lang/Integer;",
      target ↦ ⟦
        class ↦ "java/lang/Integer",
        method ↦ "intValue",
        signature ↦ "()I"
      ⟧
    ⟧
  - ⟦ 𝐵-a, 𝜏-s ↦ ⟦ φ ↦ Φ.hone.skip, 𝐵-b ⟧, 𝜏-t ↦ ⟦ φ ↦ Φ.hone.transform, 𝐵-c ⟧, 𝜏-f ↦ ⟦ φ ↦ Φ.hone.p-filter, 𝐵-d ⟧, 𝐵-e ⟧
