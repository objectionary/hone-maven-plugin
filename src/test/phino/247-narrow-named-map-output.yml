---
# yamllint disable rule:line-length
# `Function.apply` is erased, so 215 can only say Ljava/lang/Object; about what
# an object mapper returns (#635). The successor knows better: a Φ.hone.filter
# lifted from `filter(s -> s.isEmpty())` spells Ljava/lang/String; in `accepted`,
# because that is what its desugared lambda$ declares. 247 copies it into the
# mapper's `bridge-output` and `returned`, and 317 turns it into the checkcast
# that keeps the filter from being handed an Object. The successor itself is
# matched generically — 𝐵-second-head absorbs the four bindings ahead of
# `accepted` here and the seven a capturing operator would put there — and comes
# out of the rewrite untouched.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/247-narrow-named-map-output.phr
input: |
  ⟦
    j$body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.named-map,
        class ↦ "Foo",
        object ↦ "Tagger",
        bridge-input ↦ "Ljava/lang/Object;",
        bridge-output ↦ "Ljava/lang/Object;",
        accepted ↦ "Ljava/lang/Object;",
        returned ↦ "Ljava/lang/Object;",
        static ↦ "true"
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.o-filter,
        opcode ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i1 ↦ "java/util/stream/Stream", i2 ↦ "filter", i3 ↦ "(Ljava/util/function/Predicate;)Ljava/util/stream/Stream;", i4 ↦ Φ.true ⟧,
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/String;",
        bridge-output ↦ "Z",
        accepted ↦ "Ljava/lang/String;",
        returned ↦ "Z",
        static ↦ "true",
        target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$main$0", signature ↦ "(Ljava/lang/String;)Z", is-interface ↦ Φ.false ⟧
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.named-map, class ↦ "Foo", object ↦ "Tagger", bridge-input ↦ "Ljava/lang/Object;", bridge-output ↦ "Ljava/lang/String;", accepted ↦ "Ljava/lang/Object;", returned ↦ "Ljava/lang/String;", static ↦ "true" ⟧
  - ⟦ φ ↦ Φ.hone.o-filter, 𝐵-head, accepted ↦ "Ljava/lang/String;", returned ↦ "Z", static ↦ "true", 𝐵-tail ⟧
