---
# yamllint disable rule:line-length
# The capturing filter of #1423: a plain filter behind the Φ.hone.cp-filter
# that 113 lifts and 118 gathers. Like the capturing map of #821 and the
# capturing dropWhile of #981, it carries `state-acc`, `body-acc` and `captures`
# ahead of `class`, so 281 never matches it, the site was left without a dup,
# and the second predicate ate the only copy of the item. 283's 𝐵-first-head
# absorbs the three accumulators, so the fix is one more name in its
# alternation. The cp-filter here is a drained one, `captures` empty, the
# state it is in by the time the 2xx rules see it; the dup opcode is read off
# the filter's `bridge-input`, an Object, so it is the one-slot `dup`.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/283-insert-dup-before-filter-after-stateful.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.cp-filter,
        state-acc ↦ ⟦
          s1 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧
        ⟧,
        body-acc ↦ ⟦
          b1 ↦ ⟦ φ ↦ Φ.hone.cap-fetch, code ↦ "I" ⟧
        ⟧,
        captures ↦ "",
        class ↦ "cap/X",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "Ljava/lang/Integer;",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 6,
          class ↦ "cap/X",
          method ↦ "lambda$run$0",
          signature ↦ "(ILjava/lang/Integer;)Z",
          is-interface ↦ Φ.false
        ⟧
      ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.hone.o-filter,
        opcode ↦ "invokestatic",
        class ↦ "cap/X",
        bridge-input ↦ "Ljava/lang/Object;",
        bridge-output ↦ "Ljava/lang/Object;",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "Ljava/lang/Object;",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 6,
          class ↦ "cap/X",
          method ↦ "lambda$run$1",
          signature ↦ "(Ljava/lang/Integer;)Z",
          is-interface ↦ Φ.false
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-head, 𝜏-cfilter ↦ ⟦ φ ↦ Φ.hone.cp-filter, 𝐵-cfilter ⟧, 𝜏-dup ↦ ⟦ φ ↦ Φ.hone.dup, opcode ↦ "dup", class ↦ "cap/X" ⟧, 𝜏-filter ↦ ⟦ φ ↦ Φ.hone.o-filter, 𝐵-filter ⟧, 𝐵-tail ⟧
