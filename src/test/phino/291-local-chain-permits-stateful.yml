---
# yamllint disable rule:line-length
# 291 renames a stateful pragma to `local-…` when the chain it sits on provably
# starts at a sequential source and ends at a terminal in the SAME body, which
# is the precondition the parallel guards were written against but never checked
# (#971). 292's siblings revert whatever keeps the bare name.
#
# Two method bodies, which is the whole test. The first builds its own stream
# with `Stream.of` and consumes it with `toList`, so its `distinct` is provably
# sequential and earns the rename. The second takes the stream as a PARAMETER —
# an `aload` and nothing else in front of the pragma — so it could have been
# handed `items.parallelStream()` by a caller and must NOT be renamed. That is
# the exact shape the issue reports.
#
# The second expectation is CLOSED on the three bindings 220 emits, so it
# matches only a pragma this rule left completely alone: renaming it, or
# stamping it with an added binding, fails the pack.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/291-local-chain-permits-stateful.phr
input: |
  ⟦
    localm ↦ ⟦
      i0 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, v0 ↦ "java/util/stream/Stream", v1 ↦ "of", v2 ↦ "([Ljava/lang/Object;)Ljava/util/stream/Stream;", v3 ↦ Φ.false ⟧,
      i1 ↦ ⟦ φ ↦ Φ.hone.distinct, class ↦ "fusion/X", stream-class ↦ "java/util/stream/Stream" ⟧,
      i2 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", v1 ↦ "toList", v2 ↦ "()Ljava/util/List;", v3 ↦ Φ.true ⟧,
      ρ ↦ ∅
    ⟧,
    paramm ↦ ⟦
      j0 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧,
      j1 ↦ ⟦ φ ↦ Φ.hone.skip, class ↦ "fusion/X", stream-class ↦ "java/util/stream/Stream", push ↦ 5 ⟧,
      j2 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, v0 ↦ "java/util/stream/Stream", v1 ↦ "toList", v2 ↦ "()Ljava/util/List;", v3 ↦ Φ.true ⟧,
      ρ ↦ ∅
    ⟧,
    ρ ↦ ∅
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.local-distinct, class ↦ "fusion/X", stream-class ↦ "java/util/stream/Stream" ⟧
  - ⟦ φ ↦ Φ.hone.skip, class ↦ "fusion/X", stream-class ↦ "java/util/stream/Stream", push ↦ 5 ⟧
