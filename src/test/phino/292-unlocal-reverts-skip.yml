---
# yamllint disable rule:line-length
# A skip that 291 could not prove local goes back to the native call (#971): its
# stream may have been handed in by a caller who made it parallel, and the
# long[1] countdown 308 would fuse into races across ForkJoin workers.
#
# The count push rides back out with it, which is why this rule carries the
# enclosing binding groups rather than matching the pragma alone: ONE pragma
# becomes TWO siblings in the body. Written the other way the two nest inside a
# single object and jeo cannot assemble it — which is how the first draft of
# this rule failed.
#
# So the expectations pin both halves and their order: the push first, the
# reverted call second, carrying the `reverted ↦ Φ.true` marker that stops 220
# lifting it straight back again.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/2xx/292-unlocal-reverts-skip.phr
input: |
  ⟦
    body ↦ ⟦
      j0 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, v0 ↦ 0 ⟧,
      j1 ↦ ⟦
        φ ↦ Φ.hone.skip,
        class ↦ "fusion/X",
        stream-class ↦ "java/util/stream/Stream",
        push ↦ ⟦ φ ↦ Φ.jeo.opcode.ldc, v0 ↦ 5 ⟧
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/stream/Stream", i3 ↦ "skip", i4 ↦ "(J)Ljava/util/stream/Stream;", i5 ↦ Φ.true, reverted ↦ Φ.true ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.ldc, v0 ↦ 5 ⟧
