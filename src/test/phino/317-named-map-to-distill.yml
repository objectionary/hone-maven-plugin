---
# yamllint disable rule:line-length
# 317 folds the pragma 215 lifted into a STATEFUL distill, because the mapper
# object is built once when the pipeline is assembled and called once per
# element (#635). The `state` block is the append 502 relocates into the caller:
# `dup; new Doubler; dup; invokespecial <init>()V; List.add; pop`, leaving the
# List where it found it. The `body` is the auto emit-shape — park the item in
# local 1, fetch the mapper (521 turns that into List.get(counter++) plus a
# checkcast to Function), reload the item above it, call `apply`, and narrow the
# erased result to whatever 247 wrote into `returned`. Here that is
# Ljava/lang/Integer;, so the cast is `checkcast java/lang/Integer`; when 247
# found nothing to read it stays java/lang/Object and the cast is a no-op.
# `start` is "named-map" rather than "map", which keeps 413 and 281 away from a
# body that needs neither.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/3xx/317-named-map-to-distill.phr
input: |
  ⟦
    φ ↦ Φ.hone.named-map,
    class ↦ "Foo",
    object ↦ "Doubler",
    init ↦ "()V",
    args ↦ ⟦ ρ ↦ ∅ ⟧,
    bridge-input ↦ "Ljava/lang/Object;",
    bridge-output ↦ "Ljava/lang/Integer;",
    accepted ↦ "Ljava/lang/Object;",
    returned ↦ "Ljava/lang/Integer;",
    static ↦ "true"
  ⟧
expected:
  - ⟦ φ ↦ Φ.hone.distill, class ↦ "Foo", bridge-input ↦ "Ljava/lang/Object;", bridge-output ↦ "Ljava/lang/Integer;", start ↦ "named-map", 𝐵-rest ⟧
  - ⟦ 𝜏-d ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, 𝜏-n ↦ ⟦ φ ↦ Φ.jeo.opcode.new, i1 ↦ "Doubler" ⟧, 𝜏-d2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧, 𝜏-i ↦ ⟦ φ ↦ Φ.jeo.opcode.invokespecial, i2 ↦ "Doubler", i3 ↦ "<init>", i4 ↦ "()V", i5 ↦ Φ.false ⟧, 𝜏-a ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/List", i3 ↦ "add", i4 ↦ "(Ljava/lang/Object;)Z", i5 ↦ Φ.true ⟧, 𝜏-p ↦ ⟦ φ ↦ Φ.jeo.opcode.pop ⟧, ρ ↦ ∅ ⟧
  - ⟦ 𝜏-park ↦ ⟦ φ ↦ Φ.jeo.opcode.astore, i1 ↦ 1 ⟧, 𝜏-f ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/util/function/Function" ⟧, 𝜏-r ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, i1 ↦ 1 ⟧, 𝜏-c ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/function/Function", i3 ↦ "apply", i4 ↦ "(Ljava/lang/Object;)Ljava/lang/Object;", i5 ↦ Φ.true ⟧, 𝜏-x ↦ ⟦ φ ↦ Φ.jeo.opcode.checkcast, i1 ↦ "java/lang/Integer" ⟧, ρ ↦ ∅ ⟧
