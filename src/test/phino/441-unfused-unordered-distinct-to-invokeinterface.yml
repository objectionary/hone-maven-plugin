---
# yamllint disable rule:line-length
# The same revert for the guard `307-unordered-distinct-to-distill` builds
# (#970): its seen-set is a synchronized java/util/Set, so the `add` is an
# `invokeinterface` and not the sibling's `invokevirtual` on a HashSet. 441
# takes that opcode as a metavariable, so both unfused distincts revert.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/441-unfused-distinct-to-invokeinterface.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill,
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/Object;",
        bridge-output ↦ "Ljava/lang/Object;",
        start ↦ "distinct",
        accepted ↦ "Ljava/lang/Object;",
        returned ↦ "Ljava/lang/Object;",
        static ↦ "true",
        state ↦ ⟦ s ↦ ⟦ set ↦ "synchronizedSet" ⟧ ⟧,
        body ↦ ⟦
          b1 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/util/Set" ⟧,
          b2 ↦ ⟦ φ ↦ Φ.jeo.opcode.swap ⟧,
          b3 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup_x1 ⟧,
          b4 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokeinterface,
            i1 ↦ "java/util/Set",
            i2 ↦ "add",
            i3 ↦ "(Ljava/lang/Object;)Z",
            i4 ↦ Φ.true
          ⟧,
          b5 ↦ ⟦ φ ↦ Φ.jeo.opcode.ifne, i2 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧ ⟧,
          b6 ↦ ⟦ φ ↦ Φ.jeo.opcode.pop ⟧,
          b7 ↦ ⟦ φ ↦ Φ.jeo.opcode.return ⟧,
          b8 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧,
          b9 ↦ ⟦ φ ↦ Φ.hone.frame-item ⟧
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, 𝐵-a, reverted ↦ Φ.true, 𝐵-b ⟧
