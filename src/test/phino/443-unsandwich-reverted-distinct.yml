---
# yamllint disable rule:line-length
# A primitive distinct that 441 handed back because it found nothing to fuse
# with takes its boxing sandwich off again, so the class ends up with the
# native IntStream.distinct() it started with rather than a boxed() round-trip
# bought for no fusion at all (#996).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/443-unsandwich-reverted-distinct.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦ φ ↦ Φ.hone.box, stream-class ↦ "java/util/stream/IntStream", minted ↦ "sandwich" ⟧,
      op2 ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        i2 ↦ "java/util/stream/Stream",
        i3 ↦ "distinct",
        i4 ↦ "()Ljava/util/stream/Stream;",
        i5 ↦ Φ.true,
        reverted ↦ Φ.true
      ⟧,
      op3 ↦ ⟦
        φ ↦ Φ.hone.unbox,
        opcode ↦ "invokevirtual",
        class ↦ "Foo",
        bridge-signature ↦ "(Ljava/lang/Integer;)I",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 5,
          class ↦ "java/lang/Integer",
          method ↦ "intValue",
          signature ↦ "()I",
          is-interface ↦ Φ.false
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦
      body ↦ ⟦
        𝜏-native ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/IntStream",
          i3 ↦ "distinct",
          i4 ↦ "()Ljava/util/stream/IntStream;",
          i5 ↦ Φ.true,
          reverted ↦ Φ.true
        ⟧
      ⟧
    ⟧
