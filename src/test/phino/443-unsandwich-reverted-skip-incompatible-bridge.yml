        class ↦ "Foo",
        bridge-signature ↦ "(Ljava/lang/Integer;)J",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 5,
          class ↦ "java/lang/Integer",
          method ↦ "intValue",
          signature ↦ "()I",
          is-interface ↦ Φ.false
        ⟧
      ⟧
    ⟧
