---
# yamllint disable rule:line-length
# The skip half of 443-unsandwich-reverted-distinct (#996): 442's revert is TWO
# opcodes, so the sandwich to collapse is box, push, call, unbox, and the push
# comes back out with the call.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/443-unsandwich-reverted-skip.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦ φ ↦ Φ.hone.box, stream-class ↦ "java/util/stream/IntStream", minted ↦ "sandwich" ⟧,
      op2 ↦ ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧,
      op3 ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        i2 ↦ "java/util/stream/Stream",
        i3 ↦ "skip",
        i4 ↦ "(J)Ljava/util/stream/Stream;",
        i5 ↦ Φ.true,
        reverted ↦ Φ.true
      ⟧,
      op4 ↦ ⟦
        φ ↦ Φ.hone.unbox,
        opcode ↦ "invokevirtual",
        class ↦ "Foo",
        bridge-signature ↦ "(Ljava/lang/Integer;)I",
        static ↦ "true",
        target ↦ ⟦
          handle ↦ 5,
          class ↦ "java/lang/Integer",
          method ↦ "intValue",
          signature ↦ "()I",
          is-interface ↦ Φ.false
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦
      body ↦ ⟦
        𝜏-push ↦ ⟦ φ ↦ Φ.jeo.opcode.lconst_1 ⟧,
        𝜏-native ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/IntStream",
          i3 ↦ "skip",
          i4 ↦ "(J)Ljava/util/stream/IntStream;",
          i5 ↦ Φ.true,
          reverted ↦ Φ.true
        ⟧
      ⟧
    ⟧
