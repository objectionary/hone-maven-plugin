---
# yamllint disable rule:line-length
# A crossing that DID fuse is left alone. The distill below carries a third
# opcode — the `String.length()` a trailing `mapToInt` handed it through 451 —
# so the body pattern, which is closed on 421's unwrapping plus the one call
# 306 folded, no longer matches and the run lowers to the single `mapMulti`
# that the box in front of it pays for.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/452-unfused-crossing-to-mapToObj.phr
input: |
  ⟦
    body ↦ ⟦
      box ↦ ⟦
        φ ↦ Φ.hone.box,
        stream-class ↦ "java/util/stream/IntStream",
        minted ↦ "crossing"
      ⟧,
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill,
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/Integer;",
        bridge-output ↦ "I",
        start ↦ "map",
        accepted ↦ "Ljava/lang/Integer;",
        returned ↦ "I",
        static ↦ "true",
        state ↦ ⟦⟧,
        body ↦ ⟦
          b1 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokevirtual,
            i2 ↦ "java/lang/Integer",
            i3 ↦ "intValue",
            i4 ↦ "()I",
            i5 ↦ Φ.false
          ⟧,
          b2 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "Foo",
            i3 ↦ "lambda$main$0",
            i4 ↦ "(I)Ljava/lang/String;",
            i5 ↦ Φ.false
          ⟧,
          b3 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokevirtual,
            i2 ↦ "java/lang/String",
            i3 ↦ "length",
            i4 ↦ "()I",
            i5 ↦ Φ.false
          ⟧
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-box ↦ ⟦ φ ↦ Φ.hone.box, stream-class ↦ "java/util/stream/IntStream", minted ↦ "crossing" ⟧, 𝜏-distill ↦ ⟦ φ ↦ Φ.hone.distill, 𝐵-b ⟧, 𝐵-c ⟧
