---
# yamllint disable rule:line-length
# The crossing 208 minted never found a neighbour: after 401 and 451 its distill
# still carries nothing but 421's unwrapping and the call to the mapper. The box
# in front of it would have become a `boxed()` and the distill a `mapMulti` that
# unboxes what the box had just boxed, so the pair goes back to the
# `Φ.hone.lambda` 208 consumed and 701 lowers it to the original `mapToObj`. The
# lambda lands where the box stood, between the source call and the terminal, so
# the `boxed()` stage is gone rather than merely unfused (#1105). The
# `reverted ↦ Φ.true` marker is what stops 208 from splitting it all over again
# on a run with more than one cycle.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/452-unfused-crossing-to-mapToObj.phr
input: |
  ⟦
    body ↦ ⟦
      src ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        i2 ↦ "java/util/stream/LongStream",
        i3 ↦ "of",
        i4 ↦ "([J)Ljava/util/stream/LongStream;",
        i5 ↦ Φ.true
      ⟧,
      box ↦ ⟦
        φ ↦ Φ.hone.box,
        stream-class ↦ "java/util/stream/LongStream",
        minted ↦ "crossing"
      ⟧,
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill,
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/Long;",
        bridge-output ↦ "Ljava/lang/Long;",
        start ↦ "map",
        accepted ↦ "Ljava/lang/Long;",
        returned ↦ "Ljava/lang/Long;",
        static ↦ "true",
        state ↦ ⟦ ρ ↦ ∅ ⟧,
        body ↦ ⟦
          b1 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokevirtual,
            i2 ↦ "java/lang/Long",
            i3 ↦ "longValue",
            i4 ↦ "()J",
            i5 ↦ Φ.false
          ⟧,
          b2 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "Foo",
            i3 ↦ "lambda$hone$42",
            i4 ↦ "(J)Ljava/lang/Long;",
            i5 ↦ Φ.false
          ⟧,
          ρ ↦ ∅
        ⟧
      ⟧,
      sink ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        i2 ↦ "java/util/stream/Stream",
        i3 ↦ "toList",
        i4 ↦ "()Ljava/util/List;",
        i5 ↦ Φ.true
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-src ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/stream/LongStream", 𝐵-b ⟧, 𝜏-lambda ↦ ⟦ φ ↦ Φ.hone.lambda, 𝐵-c ⟧, 𝜏-sink ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/stream/Stream", 𝐵-d ⟧, 𝐵-e ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, method ↦ "apply", interface ↦ "()Ljava/util/function/LongFunction;", lambda-signature ↦ "(J)Ljava/lang/Object;", bridge-signature ↦ "(J)Ljava/lang/Long;", 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$hone$42", signature ↦ "(J)Ljava/lang/Long;", is-interface ↦ Φ.false ⟧, 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, stream ↦ ⟦ class ↦ "java/util/stream/LongStream", method ↦ "mapToObj", signature ↦ "(Ljava/util/function/LongFunction;)Ljava/util/stream/Stream;" ⟧, 𝐵-c ⟧
  - ⟦ φ ↦ Φ.hone.lambda, 𝐵-a, reverted ↦ Φ.true, 𝐵-b ⟧
