---
# yamllint disable rule:line-length
# A filter distill that DID fuse: 401 has spliced a second stage's opcodes
# behind the guard, so the distill pays for its `mapMulti` and must be left
# for 501 to lower. The closed six-binding body in 453's pattern is what
# refuses it (#1218).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/453-unfused-filter-to-lambda.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill,
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/String;",
        bridge-output ↦ "Ljava/lang/String;",
        start ↦ "dup",
        accepted ↦ "Ljava/lang/String;",
        returned ↦ "Ljava/lang/String;",
        static ↦ "true",
        state ↦ ⟦⟧,
        body ↦ ⟦
          b0 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
          b1 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "Foo",
            i3 ↦ "lambda$main$0",
            i4 ↦ "(Ljava/lang/String;)Z",
            i5 ↦ Φ.false
          ⟧,
          b2 ↦ ⟦
            φ ↦ Φ.jeo.opcode.ifne,
            i2 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L3049512" ⟧
          ⟧,
          b3 ↦ ⟦ φ ↦ Φ.jeo.opcode.return ⟧,
          b4 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L3049512" ⟧,
          b5 ↦ ⟦ φ ↦ Φ.hone.frame-item ⟧,
          b6 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "Foo",
            i3 ↦ "lambda$main$1",
            i4 ↦ "(Ljava/lang/String;)Ljava/lang/String;",
            i5 ↦ Φ.false
          ⟧
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-distill ↦ ⟦ φ ↦ Φ.hone.distill, 𝐵-b, start ↦ "dup", 𝐵-c ⟧, 𝐵-d ⟧
