---
# yamllint disable rule:line-length
# A map distill that DID fuse: 401 has spliced a second mapper call into its
# body, so the distill pays for its `mapMulti` and must be left for 501 to
# lower. The closed body in 453's pattern is what refuses it (#1128).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/453-unfused-map-to-lambda.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill,
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/String;",
        bridge-output ↦ "Ljava/lang/Integer;",
        start ↦ "map",
        accepted ↦ "Ljava/lang/String;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        state ↦ ⟦⟧,
        body ↦ ⟦
          b1 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "Foo",
            i3 ↦ "lambda$main$0",
            i4 ↦ "(Ljava/lang/String;)Ljava/lang/String;",
            i5 ↦ Φ.false
          ⟧,
          b2 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "Foo",
            i3 ↦ "lambda$main$1",
            i4 ↦ "(Ljava/lang/String;)Ljava/lang/Integer;",
            i5 ↦ Φ.false
          ⟧
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-distill ↦ ⟦ φ ↦ Φ.hone.distill, 𝐵-b, start ↦ "map", 𝐵-c ⟧, 𝐵-d ⟧
