---
# yamllint disable rule:line-length
# A map distill that never fused: after the fuse pass its body still carries
# nothing but the call to the mapper 202 took from the lambda. 501/511 would
# lower it to a `mapMulti` over a fresh wrapper for no fusion benefit, so it
# goes back to the `Φ.hone.lambda` 202 consumed and 701 lowers it to the
# original `Stream.map` (#1128). The `reverted ↦ Φ.true` marker is what stops
# 202 from recognising it all over again on a run with more than one cycle.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/453-unfused-map-to-lambda.phr
input: |
  ⟦
    body ↦ ⟦
      src ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        i2 ↦ "java/util/List",
        i3 ↦ "stream",
        i4 ↦ "()Ljava/util/stream/Stream;",
        i5 ↦ Φ.true
      ⟧,
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill,
        class ↦ "Foo",
        bridge-input ↦ "Ljava/lang/String;",
        bridge-output ↦ "Ljava/lang/Integer;",
        start ↦ "map",
        accepted ↦ "Ljava/lang/String;",
        returned ↦ "Ljava/lang/Integer;",
        static ↦ "true",
        state ↦ ⟦ ρ ↦ ∅ ⟧,
        body ↦ ⟦
          b1 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "Foo",
            i3 ↦ "lambda$main$0",
            i4 ↦ "(Ljava/lang/String;)Ljava/lang/Integer;",
            i5 ↦ Φ.false
          ⟧,
          ρ ↦ ∅
        ⟧
      ⟧,
      sink ↦ ⟦
        φ ↦ Φ.jeo.opcode.invokeinterface,
        i2 ↦ "java/util/stream/Stream",
        i3 ↦ "toList",
        i4 ↦ "()Ljava/util/List;",
        i5 ↦ Φ.true
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, 𝜏-src ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/List", 𝐵-b ⟧, 𝜏-lambda ↦ ⟦ φ ↦ Φ.hone.lambda, 𝐵-c ⟧, 𝜏-sink ↦ ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/stream/Stream", 𝐵-d ⟧, 𝐵-e ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, method ↦ "apply", interface ↦ "()Ljava/util/function/Function;", lambda-signature ↦ "(Ljava/lang/Object;)Ljava/lang/Object;", bridge-signature ↦ "(Ljava/lang/String;)Ljava/lang/Integer;", 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$main$0", signature ↦ "(Ljava/lang/String;)Ljava/lang/Integer;", is-interface ↦ Φ.false ⟧, 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, stream ↦ ⟦ class ↦ "java/util/stream/Stream", method ↦ "map", signature ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;" ⟧, 𝐵-c ⟧
  - ⟦ φ ↦ Φ.hone.lambda, 𝐵-a, reverted ↦ Φ.true, 𝐵-b ⟧
