---
# yamllint disable rule:line-length
# A `LongStream.filter` that never fused: once 411 has swallowed the box and
# the unbox the transforms wedged around the predicate, the distill is all
# `J`, its body is still the guard (a `dup2` — two slots), the single call to
# the `(J)Z` lambda and 304's branch over it. It goes back to the
# `Φ.hone.lambda` the pipeline consumed, rebuilt from the primitive —
# `LongPredicate`, its `test` and the `LongStream.filter` signature — so 701
# lowers it to the call javac emitted instead of a `mapMulti` over a wrapper
# (#1218).
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/453-unfused-primitive-filter-to-lambda.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill,
        class ↦ "Foo",
        bridge-input ↦ "J",
        bridge-output ↦ "J",
        start ↦ "dup",
        accepted ↦ "J",
        returned ↦ "J",
        static ↦ "true",
        state ↦ ⟦⟧,
        body ↦ ⟦
          b0 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup2 ⟧,
          b1 ↦ ⟦
            φ ↦ Φ.jeo.opcode.invokestatic,
            i2 ↦ "Foo",
            i3 ↦ "lambda$ordered$3",
            i4 ↦ "(J)Z",
            i5 ↦ Φ.false
          ⟧,
          b2 ↦ ⟦
            φ ↦ Φ.jeo.opcode.ifne,
            i2 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L3044810" ⟧
          ⟧,
          b3 ↦ ⟦ φ ↦ Φ.jeo.opcode.return ⟧,
          b4 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L3044810" ⟧,
          b5 ↦ ⟦ φ ↦ Φ.hone.frame-item ⟧
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, method ↦ "test", interface ↦ "()Ljava/util/function/LongPredicate;", lambda-signature ↦ "(J)Z", bridge-signature ↦ "(J)Z", 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$ordered$3", signature ↦ "(J)Z", is-interface ↦ Φ.false ⟧, 𝐵-c ⟧
  - ⟦ 𝐵-a, φ ↦ Φ.hone.lambda, 𝐵-b, stream ↦ ⟦ class ↦ "java/util/stream/LongStream", method ↦ "filter", signature ↦ "(Ljava/util/function/LongPredicate;)Ljava/util/stream/LongStream;" ⟧, 𝐵-c ⟧
  - ⟦ φ ↦ Φ.hone.lambda, 𝐵-a, reverted ↦ Φ.true, 𝐵-b ⟧
