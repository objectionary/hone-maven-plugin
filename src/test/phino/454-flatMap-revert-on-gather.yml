---
# yamllint disable rule:line-length
# The same revert, with `.gather(Gatherer)` as the short-circuit instead of
# `.limit(J)` (#972). A Gatherer whose integrator returns `false` stops the
# upstream and the JDK honours that through flatMap, so the fused form — whose
# adapter drains each inner stream with an unconditional `forEach` — hangs on
# an unbounded inner stream exactly as the `limit` form does:
#
#     Stream.of(1L)
#       .flatMap(x -> Stream.iterate(x, i -> i + 1))
#       .gather(takeWhileGatherer)     // terminates unfused, hangs fused
#       .toList();
#
# `gather` takes a `Gatherer` rather than a lambda, so `111` leaves it as the
# raw opcode this rule's pattern binds. It went missing from the list because
# it was still a preview API when #816 drew the list up; it reached final API
# status in Java 24.
#
# The end-to-end fixtures cannot cover this one: `OptimizeMojoYamlPackTest`
# compiles every pack at `maven.compiler.release=17` and the deep workflow runs
# on JDK 21, so a `.gather(...)` source file does not compile there at all.
# This pack and its lifted sibling are what keep the name on the list.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/454-flatMap-revert-on-short-circuit.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    jm$main ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        φ ↦ Φ.jeo.seq.of,
        op0 ↦ ⟦
          φ ↦ Φ.hone.lambda,
          class ↦ "Foo",
          method ↦ "apply",
          interface ↦ "()Ljava/util/function/Function;",
          lambda-signature ↦ "(Ljava/lang/Object;)Ljava/lang/Object;",
          bridge-signature ↦ "(Ljava/lang/Long;)Ljava/util/stream/Stream;",
          static ↦ "true",
          opcode ↦ "invokestatic",
          target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$main$0", signature ↦ "(Ljava/lang/Long;)Ljava/util/stream/Stream;", is-interface ↦ Φ.false ⟧,
          stream ↦ ⟦ class ↦ "java/util/stream/Stream", method ↦ "flatMap", signature ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;" ⟧
        ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.jeo.opcode.invokeinterface,
          i2 ↦ "java/util/stream/Stream",
          i3 ↦ "gather",
          i4 ↦ "(Ljava/util/stream/Gatherer;)Ljava/util/stream/Stream;",
          i5 ↦ Φ.true
        ⟧,
        ρ ↦ ∅
      ⟧
    ⟧,
    ρ ↦ ∅
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.invokedynamic, i2 ↦ "apply", i3 ↦ "()Ljava/util/function/Function;", 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/stream/Stream", i3 ↦ "flatMap", i4 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", i5 ↦ Φ.true, reverted ↦ Φ.true ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/stream/Stream", i3 ↦ "gather", i4 ↦ "(Ljava/util/stream/Gatherer;)Ljava/util/stream/Stream;", i5 ↦ Φ.true ⟧
