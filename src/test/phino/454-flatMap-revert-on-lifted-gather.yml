---
# yamllint disable rule:line-length
# The lifted half of the `gather` guard (#972). `Gatherer` has exactly one
# abstract method, `integrator()`, so javac accepts a lambda for it and `111`
# lifts the pair into a Φ.hone.lambda the way it lifts a `takeWhile`'s — which
# is why `gather` has to be on BOTH name lists and not only the sibling's,
# where a `gather(Gatherers.mapConcurrent(...))` arrives as a raw opcode.
#
# Either way the flatMap must stay native: a Gatherer whose integrator returns
# `false` stops the upstream, the JDK honours that through flatMap by polling
# `cancellationRequested()`, and 455's adapter — which drains each inner stream
# with an unconditional `forEach` — cannot. The downstream gather lambda is
# left untouched; only the flatMap is reverted.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/454-flatMap-revert-on-lifted-short-circuit.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    jm$main ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        φ ↦ Φ.jeo.seq.of,
        op0 ↦ ⟦
          φ ↦ Φ.hone.lambda,
          class ↦ "Foo",
          method ↦ "apply",
          interface ↦ "()Ljava/util/function/Function;",
          lambda-signature ↦ "(Ljava/lang/Object;)Ljava/lang/Object;",
          bridge-signature ↦ "(Ljava/lang/Long;)Ljava/util/stream/Stream;",
          static ↦ "true",
          opcode ↦ "invokestatic",
          target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$main$0", signature ↦ "(Ljava/lang/Long;)Ljava/util/stream/Stream;", is-interface ↦ Φ.false ⟧,
          stream ↦ ⟦ class ↦ "java/util/stream/Stream", method ↦ "flatMap", signature ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;" ⟧
        ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.hone.lambda,
          class ↦ "Foo",
          method ↦ "integrator",
          interface ↦ "()Ljava/util/stream/Gatherer;",
          lambda-signature ↦ "()Ljava/util/stream/Gatherer$Integrator;",
          bridge-signature ↦ "()Ljava/util/stream/Gatherer$Integrator;",
          static ↦ "true",
          opcode ↦ "invokestatic",
          target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$main$1", signature ↦ "()Ljava/util/stream/Gatherer$Integrator;", is-interface ↦ Φ.false ⟧,
          stream ↦ ⟦ class ↦ "java/util/stream/Stream", method ↦ "gather", signature ↦ "(Ljava/util/stream/Gatherer;)Ljava/util/stream/Stream;" ⟧
        ⟧,
        ρ ↦ ∅
      ⟧
    ⟧,
    ρ ↦ ∅
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.invokedynamic, i2 ↦ "apply", i3 ↦ "()Ljava/util/function/Function;", 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokeinterface, i2 ↦ "java/util/stream/Stream", i3 ↦ "flatMap", i4 ↦ "(Ljava/util/function/Function;)Ljava/util/stream/Stream;", i5 ↦ Φ.true, reverted ↦ Φ.true ⟧
  - ⟦ φ ↦ Φ.hone.lambda, class ↦ "Foo", method ↦ "integrator", 𝐵-rest ⟧
