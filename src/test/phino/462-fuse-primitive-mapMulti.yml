---
# yamllint disable rule:line-length
# 462 fuses adjacent primitive mapMulti stages — the shape 461 declined because
# it pins the object Stream, its BiConsumer SAM and the object stream signature
# in all three places it names a stream call (#983).
#
# The input chains THREE IntStream.mapMulti pragmas over non-capturing
# lambda$main$0..2, so the fusion is plainly ITERATIVE and not a one-shot pair
# merge: phino runs to a fixpoint, folding the first pair into a `fused`/`wrap`
# pair and then folding that product with the third. In the unfused input every
# lambda$main$N appears only as a target INSIDE a pragma and never as an
# invokestatic opcode, so matching an invokestatic to each of the three proves
# all three were wired into synthesised bodies.
#
# The last two patterns are the reason this is worth a pack of its own. They pin
# the LOCAL SLOTS: `fused` loads the int item from 0 and its sink from 1, and
# `wrap` loads the item from 1 and its sink from 0. Everything else in this rule
# is a type rename away from 461; the slots are not, and the long and double
# arms move them.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/4xx/462-fuse-primitive-mapMulti.phr
input: |
  ⟦
    φ ↦ Φ.jeo.class,
    name ↦ "Foo",
    jm$main ↦ ⟦
      φ ↦ Φ.jeo.method,
      name ↦ "main",
      body ↦ ⟦
        φ ↦ Φ.jeo.seq.of3,
        op0 ↦ ⟦
          φ ↦ Φ.hone.lambda,
          class ↦ "Foo",
          method ↦ "accept",
          interface ↦ "()Ljava/util/stream/IntStream$IntMapMultiConsumer;",
          lambda-signature ↦ "(ILjava/util/function/IntConsumer;)V",
          bridge-signature ↦ "(ILjava/util/function/IntConsumer;)V",
          static ↦ "true",
          opcode ↦ "invokestatic",
          target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$main$0", signature ↦ "(ILjava/util/function/IntConsumer;)V", is-interface ↦ Φ.false ⟧,
          stream ↦ ⟦ class ↦ "java/util/stream/IntStream", method ↦ "mapMulti", signature ↦ "(Ljava/util/stream/IntStream$IntMapMultiConsumer;)Ljava/util/stream/IntStream;" ⟧
        ⟧,
        op1 ↦ ⟦
          φ ↦ Φ.hone.lambda,
          class ↦ "Foo",
          method ↦ "accept",
          interface ↦ "()Ljava/util/stream/IntStream$IntMapMultiConsumer;",
          lambda-signature ↦ "(ILjava/util/function/IntConsumer;)V",
          bridge-signature ↦ "(ILjava/util/function/IntConsumer;)V",
          static ↦ "true",
          opcode ↦ "invokestatic",
          target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$main$1", signature ↦ "(ILjava/util/function/IntConsumer;)V", is-interface ↦ Φ.false ⟧,
          stream ↦ ⟦ class ↦ "java/util/stream/IntStream", method ↦ "mapMulti", signature ↦ "(Ljava/util/stream/IntStream$IntMapMultiConsumer;)Ljava/util/stream/IntStream;" ⟧
        ⟧,
        op2 ↦ ⟦
          φ ↦ Φ.hone.lambda,
          class ↦ "Foo",
          method ↦ "accept",
          interface ↦ "()Ljava/util/stream/IntStream$IntMapMultiConsumer;",
          lambda-signature ↦ "(ILjava/util/function/IntConsumer;)V",
          bridge-signature ↦ "(ILjava/util/function/IntConsumer;)V",
          static ↦ "true",
          opcode ↦ "invokestatic",
          target ↦ ⟦ handle ↦ 6, class ↦ "Foo", method ↦ "lambda$main$2", signature ↦ "(ILjava/util/function/IntConsumer;)V", is-interface ↦ Φ.false ⟧,
          stream ↦ ⟦ class ↦ "java/util/stream/IntStream", method ↦ "mapMulti", signature ↦ "(Ljava/util/stream/IntStream$IntMapMultiConsumer;)Ljava/util/stream/IntStream;" ⟧
        ⟧
      ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "Foo", i3 ↦ "lambda$main$0", 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "Foo", i3 ↦ "lambda$main$1", 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "Foo", i3 ↦ "lambda$main$2", 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.invokedynamic, i2 ↦ "accept", i3 ↦ "(Ljava/util/function/IntConsumer;)Ljava/util/function/IntConsumer;", 𝐵-rest ⟧
  - ⟦ φ ↦ Φ.jeo.method, 𝐵-fh, descriptor ↦ "(ILjava/util/function/IntConsumer;)V", 𝐵-ft ⟧
  - ⟦ φ ↦ Φ.jeo.method, 𝐵-wh, descriptor ↦ "(Ljava/util/function/IntConsumer;I)V", 𝐵-wt ⟧
  - ⟦ 𝐵-bh, ld-item ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, i1 ↦ 0 ⟧, ld-downstream ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, i1 ↦ 1 ⟧, 𝐵-bt ⟧
  - ⟦ 𝐵-ch, ld-item ↦ ⟦ φ ↦ Φ.jeo.opcode.iload, i1 ↦ 1 ⟧, ld-downstream ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, i1 ↦ 0 ⟧, 𝐵-ct ⟧
