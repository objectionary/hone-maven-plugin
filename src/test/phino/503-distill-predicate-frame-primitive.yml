---
# yamllint disable rule:line-length
# #995: the same rule, for a PRIMITIVE predicate. This was left to
# `503-distill-state-frame` and its `bridge-input` on the grounds that the two
# coincide, and they do while the distill is primitive end to end. Here it is
# not: `bridge-input` is the wrapper Ljava/lang/Integer; the stream carries,
# something ahead of the guard has already unboxed the item, and the guard's
# `dup` copied a raw int. A frame written from `bridge-input` promises
# java/lang/Integer over it — "Type integer (current frame, stack[0]) is not
# assignable to 'java/lang/Integer'". The predicate's own parameter names the
# survivor, exactly as `506` reads it on the stateless side. `503-distill-
# state-frame` is listed too, to prove the alphabetical order leaves it nothing
# to fall back on.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/5xx/503-distill-predicate-frame.phr
  - src/main/resources/org/eolang/hone/rules/streams/5xx/503-distill-state-frame.phr
input: |
  ⟦
    φ ↦ Φ.hone.distill-lambda,
    static ↦ "true",
    bridge-input ↦ "Ljava/lang/Integer;",
    consumer ↦ "Ljava/util/function/Consumer;",
    target-method ↦ "distill_1",
    captured ↦ "Ljava/util/List;",
    body ↦ ⟦
      i1 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokevirtual, i2 ↦ "java/lang/Integer", i3 ↦ "intValue", i4 ↦ "()I", i5 ↦ Φ.false ⟧,
      i2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
      i3 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "Foo", i3 ↦ "lambda$main$1", i4 ↦ "(I)Z", i5 ↦ Φ.false ⟧,
      i4 ↦ ⟦ φ ↦ Φ.jeo.opcode.ifne, i2 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧ ⟧,
      i5 ↦ ⟦ φ ↦ Φ.jeo.opcode.return ⟧,
      i6 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧,
      i7 ↦ ⟦ φ ↦ Φ.hone.frame-item ⟧
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.frame, type ↦ 0, 𝐵-e ⟧
  - ⟦ φ ↦ Φ.jeo.seq.of1, x0 ↦ "integer" ⟧
  - ⟦ φ ↦ Φ.jeo.seq.of4, x0 ↦ "java/util/List", x1 ↦ "java/lang/Integer", x2 ↦ "java/util/function/Consumer", x3 ↦ "integer" ⟧
