---
# yamllint disable rule:line-length
# The PRIMITIVE-predicate half of 506: a boxed-primitive chain whose element has
# been unboxed ahead of the filter guard. The synthesized method still receives
# the wrapper (bridge-input = Ljava/lang/Long;) — here because a
# mapToLong(Long::longValue) fused in AHEAD of the filter (#713); 421's head
# Long.longValue() puts a LongStream.filter(...).boxed() into the very same shape
# (#704, #811) — so by the time the guard runs the item is a two-slot `long`, the
# guard is a `dup2`, and the survivor kept at the keep-label is that primitive.
# The predicate's own parameter (J)Z names it, so 506 resolves the frame-item to
# `long`. 507 (the fallback) is also listed but sees no marker left; had it
# claimed this one, its bridge-input would wrongly declare a one-slot
# java/lang/Long and the class would fail JVM verification with "Inconsistent
# stackmap frames".
rules:
  - src/main/resources/org/eolang/hone/rules/streams/5xx/506-distill-predicate-frame.phr
  - src/main/resources/org/eolang/hone/rules/streams/5xx/507-distill-filter-frame-fallback.phr
input: |
  ⟦
    φ ↦ Φ.hone.distill-lambda,
    static ↦ "true",
    bridge-input ↦ "Ljava/lang/Long;",
    returned ↦ "J",
    consumer ↦ "Ljava/util/function/LongConsumer;",
    target-method ↦ "distill_1",
    body ↦ ⟦
      i1 ↦ ⟦ φ ↦ Φ.jeo.opcode.aload, i1 ↦ 0 ⟧,
      i2 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "Foo", i3 ↦ "lambda$hone$0", i4 ↦ "(Ljava/lang/Long;)J", i5 ↦ Φ.false ⟧,
      i3 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup2 ⟧,
      i4 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "Foo", i3 ↦ "lambda$main$0", i4 ↦ "(J)Z", i5 ↦ Φ.false ⟧,
      i5 ↦ ⟦ φ ↦ Φ.jeo.opcode.ifne, i2 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧ ⟧,
      i6 ↦ ⟦ φ ↦ Φ.jeo.opcode.return ⟧,
      i7 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧,
      i8 ↦ ⟦ φ ↦ Φ.hone.frame-item ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.frame, type ↦ 4, 𝐵-e ⟧
  - ⟦ φ ↦ Φ.jeo.seq.of1, item ↦ "long" ⟧
