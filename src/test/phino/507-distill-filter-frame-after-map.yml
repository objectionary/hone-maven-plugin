---
# yamllint disable rule:line-length
# The #794 shape: a map that changes the element type fused in front of a filter,
# so the body opens with the map's invokestatic, the guard `dup` copies its
# result and the predicate — (Ljava/lang/String;)Z — eats the copy. The survivor
# at the keep-label is the String the map minted, not the Ljava/lang/Long; the
# distill received, so 507 resolves the marker from the map's return type. 506
# declines (the predicate is not primitive) and 509 is listed too: were it to
# claim the marker, the item would come out java/lang/Long and the class would
# not verify.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/5xx/506-distill-filter-frame.phr
  - src/main/resources/org/eolang/hone/rules/streams/5xx/507-distill-filter-frame-after-map.phr
  - src/main/resources/org/eolang/hone/rules/streams/5xx/509-distill-filter-frame-fallback.phr
input: |
  ⟦
    φ ↦ Φ.hone.distill-lambda,
    static ↦ "true",
    bridge-input ↦ "Ljava/lang/Long;",
    returned ↦ "Ljava/lang/String;",
    consumer ↦ "Ljava/util/function/Consumer;",
    target-method ↦ "distill_1",
    body ↦ ⟦
      i1 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "Foo", i3 ↦ "lambda$hone$1", i4 ↦ "(Ljava/lang/Long;)Ljava/lang/String;", i5 ↦ Φ.false ⟧,
      i2 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
      i3 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokestatic, i2 ↦ "Foo", i3 ↦ "lambda$main$0", i4 ↦ "(Ljava/lang/String;)Z", i5 ↦ Φ.false ⟧,
      i4 ↦ ⟦ φ ↦ Φ.jeo.opcode.ifne, i2 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧ ⟧,
      i5 ↦ ⟦ φ ↦ Φ.jeo.opcode.return ⟧,
      i6 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧,
      i7 ↦ ⟦ φ ↦ Φ.hone.frame-item ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.frame, type ↦ 4, 𝐵-e ⟧
  - ⟦ φ ↦ Φ.jeo.seq.of1, item ↦ "java/lang/String" ⟧
