---
# yamllint disable rule:line-length
# The shape that genuinely reaches 507 (the fallback): a filter whose guarded
# call is NOT an invokestatic. 506 anchors on `Φ.jeo.opcode.invokestatic` because
# every desugared lambda body is a private static method, so an instance-lambda
# filter — whose predicate is reached through an invokevirtual — leaves its
# frame-item marker untouched. Both rules are listed, so the pack proves the
# discrimination: 506 declines, and 507 resolves the marker from bridge-input
# (Ljava/lang/Integer; -> java/lang/Integer), which is the survivor the guard's
# `dup` copied at the head of a pipeline where nothing is fused in front of the
# filter to move the element away from it. Deriving from `returned` here would
# wrongly declare `double` — trailing mapToLong/mapToDouble stages have driven
# `returned` to a primitive D — over a one-slot Integer, and fail JVM
# verification.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/5xx/506-distill-predicate-frame.phr
  - src/main/resources/org/eolang/hone/rules/streams/5xx/507-distill-filter-frame-fallback.phr
input: |
  ⟦
    φ ↦ Φ.hone.distill-lambda,
    static ↦ "true",
    bridge-input ↦ "Ljava/lang/Integer;",
    returned ↦ "D",
    consumer ↦ "Ljava/util/function/DoubleConsumer;",
    target-method ↦ "distill_1",
    body ↦ ⟦
      i1 ↦ ⟦ φ ↦ Φ.jeo.opcode.dup ⟧,
      i2 ↦ ⟦ φ ↦ Φ.jeo.opcode.invokevirtual, i2 ↦ "Foo", i3 ↦ "test", i4 ↦ "(Ljava/lang/Integer;)Z", i5 ↦ Φ.false ⟧,
      i3 ↦ ⟦ φ ↦ Φ.jeo.opcode.ifne, i2 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧ ⟧,
      i4 ↦ ⟦ φ ↦ Φ.jeo.opcode.return ⟧,
      i5 ↦ ⟦ φ ↦ Φ.jeo.label, i1 ↦ "L1" ⟧,
      i6 ↦ ⟦ φ ↦ Φ.hone.frame-item ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.frame, type ↦ 4, 𝐵-e ⟧
  - ⟦ φ ↦ Φ.jeo.seq.of1, item ↦ "java/lang/Integer" ⟧
