---
# yamllint disable rule:line-length
# The other half of #1012: a narrow item keeps the layout it always had — the
# consumer at 2 and the counter at 3 — so the derivation cannot have moved the
# case that was already working.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/5xx/512-distill-state-lambda-to-method.phr
input: |
  ⟦
    body ↦ ⟦
      op1 ↦ ⟦
        φ ↦ Φ.hone.distill-lambda,
        static ↦ "true",
        bridge-input ↦ "Ljava/lang/Object;",
        consumer ↦ "Ljava/util/function/Consumer;",
        target-method ↦ "distill_0",
        captured ↦ "Ljava/util/List;",
        body ↦ ⟦ b1 ↦ ⟦ φ ↦ Φ.jeo.opcode.nop ⟧, ρ ↦ ∅ ⟧
      ⟧,
      ρ ↦ ∅
    ⟧
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.istore, i1 ↦ 3 ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.aload, i1 ↦ 1 ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.aload, i1 ↦ 2 ⟧
