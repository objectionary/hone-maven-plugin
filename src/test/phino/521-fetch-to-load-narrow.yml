---
# yamllint disable rule:line-length
# The other half of #1012: a one-slot item leaves the counter at 3, where it
# always was.
rules:
  - src/main/resources/org/eolang/hone/rules/streams/5xx/521-fetch-to-load.phr
input: |
  ⟦
    φ ↦ Φ.jeo.method,
    access ↦ 4106,
    descriptor ↦ "(Ljava/util/List;Ljava/lang/Object;Ljava/util/function/Consumer;)V",
    params ↦ ⟦
      φ ↦ Φ.jeo.params,
      i1 ↦ ⟦ φ ↦ Φ.jeo.param, index ↦ 0, access ↦ 0, type ↦ "Ljava/util/List;" ⟧,
      i2 ↦ ⟦ φ ↦ Φ.jeo.param, index ↦ 1, access ↦ 0, type ↦ "Ljava/lang/Object;" ⟧,
      i3 ↦ ⟦ φ ↦ Φ.jeo.param, index ↦ 2, access ↦ 0, type ↦ "Ljava/util/function/Consumer;" ⟧
    ⟧,
    body ↦ ⟦
      b1 ↦ ⟦ φ ↦ Φ.hone.fetch, type ↦ "java/util/HashSet" ⟧
    ⟧,
    name ↦ "distill_0"
  ⟧
expected:
  - ⟦ φ ↦ Φ.jeo.opcode.iload, i1 ↦ 3 ⟧
  - ⟦ φ ↦ Φ.jeo.opcode.iinc, i1 ↦ 3, i2 ↦ 1 ⟧
