# Reproduction of issue #704: a primitive LongStream.filter(...).boxed() chain
# whose boxed() is consumed by a reference-stream terminal (here collect), so
# the filter stays in the boxed domain. 203 lifts the filter to a
# primitive-filter, 211 splits it into box + boxed-primitive-filter + unbox,
# and 232 promotes the boxed-primitive filter into a p-filter whose bridge-input
# is the wrapper Ljava/lang/Long; while accepted/returned stay the primitive J.
# Because the trailing .boxed() keeps the boxing alive, 411 never unwinds the
# filter distill back to a primitive one, so the distill stays in the boxed
# domain (bridge-input = Ljava/lang/Long;) and something has to reconcile the
# wrapper the distill receives with the primitive its predicate takes. Before the
# fix nothing did: the distill emitted a `long` keep-frame over a one-slot
# Ljava/lang/Long; and re-boxed that reference with a stray Long.valueOf(J), so
# the optimized class failed JVM verification with "Inconsistent stackmap frames
# at branch target 12 ... stack size doesn't match".
#
# The reconciliation is a single unbox at the head of the run: 421 prepends
# Long.longValue() and 413 puts the guard's dup2 behind it, so the whole distill
# works on the primitive and 422 re-boxes the survivor once at the tail. The
# keep-frame is the deferred Φ.hone.frame-item marker 304 leaves behind, resolved
# by 506 from the predicate's own (J)Z parameter — the value the guard duplicated
# one opcode earlier. #811 is where the second half of that arrangement comes
# from: this one-operator shape verified for a while with the dup ahead of the
# unbox and the frame read off a wrapper-promoted `returned`, and fell apart the
# moment a second operator joined the run.
#
# {1..10} filtered to multiples of 3 = {3, 6, 9}, summed back as long = 18. The
# lone filter lowers to a single Stream.mapMulti, so invokedynamic stays at 1.
java: |
  package longfilterboxed;
  import java.util.List;
  import java.util.stream.Collectors;
  import java.util.stream.LongStream;
  public class X {
    public static void main(String[] a) {
      List<Long> kept = LongStream.of(1L, 2L, 3L, 4L, 5L, 6L, 7L, 8L, 9L, 10L)
        .filter(n -> n % 3L == 0L)
        .boxed()
        .collect(Collectors.toList());
      long sum = 0L;
      for (final Long v : kept) {
        sum += v;
      }
      System.out.printf("The result is %d\n", sum);
    }
  }
log:
  - "BUILD SUCCESS"
  - "The result is 18"
before:
  invokedynamic: 1
after:
  invokedynamic: 1
