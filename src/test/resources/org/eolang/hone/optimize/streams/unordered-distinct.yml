# yamllint disable rule:line-length
# `distinct()` fusing on an explicitly UNORDERED parallel stream (#975).
#
# `224`/`225` revert every `distinct()` in a method that mentions `parallel()`,
# and the reason is encounter order: the JDK keeps the element first in
# ENCOUNTER order among equals, while the fused seen-set keeps whichever equal
# element wins the race to `add()`. That contract is conditional on the stream
# being ordered, and `BaseStream.unordered()` removes the condition — an
# unordered `distinct()` may keep ANY element among equals, which is exactly
# what a single shared seen-set already delivers. `217-unordered-permits-distinct`
# stamps the pragma so `224`/`225`, closed on the unmarked form, leave it alone.
#
# Five pipelines, one per branch of the decision:
#   * ordered    — `parallel()` and no `unordered()`. Still reverted: the map
#     goes back to a native `Stream.map`, since nothing fused into it, and a
#     native `Stream.distinct` stays between it and the sink. This is the case the relaxation must NOT touch.
#   * unordered  — `unordered().parallel()`. The map and the distinct fuse into
#     ONE mapMulti and no native distinct is left. This is #975.
#   * after      — `distinct().unordered()`. Reverted, and deliberately so:
#     `unordered()` marks a stream unordered from that point ON, so a distinct
#     ahead of it ran while the stream was still ordered and the stability
#     contract still applied. It is why `217` has no `225` twin.
#   * sequential — `unordered()` with no `parallel()` at all. Fused, as it
#     already was: `224` never fired here, and the mark changes nothing.
#   * guarded    — an unordered parallel chain where a FILTER fuses in beside
#     the distinct, so the fused body carries both the filter's guard and the
#     seen-set. It widens the count delta below and covers the one interaction
#     the four above do not: `283` inserting the filter's `dup` behind a
#     stateful operator.
#   * otherKind  — an `IntStream.unordered()` on an unrelated chain, ahead of a
#     parallel OBJECT distinct. Reverted. Detection is method-local, so without
#     `217`'s stream-class guard this unrelated call would re-permit a fusion
#     the contract forbids; this pipeline is what pins the guard.
#
# Every element here is substitutable under `equals` — strings differing only by
# a suffix this pipeline adds — and each result is `sorted()` before joining, so
# which survivor the unordered parallel distinct picks cannot change what is
# printed. That is deliberate: a fixture whose output depended on the race would
# be a flake, not an oracle.
#
# The pinned `invokeinterface` total goes UP, not down, and that is the point:
# a fused distinct trades ONE `Stream.distinct` dispatch for the seen-set and
# state calls inside the body it fused into. With `217` the class ends at 53;
# with the rule taken away it ends at 47 and five native `Stream.distinct`
# calls survive instead of three. So the number is not decoration — it moves
# with exactly the pipelines this rule re-permits, and it moves the other way
# if the relaxation ever over-applies to the three that must stay reverted.
#
# Note which set each fold builds (#970): the three marked pipelines here go
# through `307-unordered-distinct-to-distill`, whose seen-set is a
# `Collections.synchronizedSet(new HashSet<>())` reached by `invokeinterface`
# — the sequential fold's bare HashSet would race across ForkJoin workers.
# That is part of why the delta is +6 and not +2.
java: |
  package unordereddistinct;
  import java.util.List;
  import java.util.stream.Collectors;
  import java.util.stream.IntStream;
  import java.util.stream.Stream;
  public class X {
    private static final List<String> WORDS = List.of("a","bb","a","ccc","bb","a");
    private static String ordered() {
      return WORDS.stream().parallel().map(s -> s + "!").distinct()
        .sorted().collect(Collectors.joining(","));
    }
    private static String unordered() {
      return WORDS.stream().unordered().parallel().map(s -> s + "!").distinct()
        .sorted().collect(Collectors.joining(","));
    }
    private static String after() {
      return WORDS.stream().parallel().map(s -> s + "?").distinct().unordered()
        .sorted().collect(Collectors.joining(","));
    }
    private static String sequential() {
      return WORDS.stream().unordered().map(s -> s + "-").distinct()
        .sorted().collect(Collectors.joining(","));
    }
    private static String guarded() {
      return WORDS.stream().unordered().parallel().filter(s -> s.length() < 3)
        .map(s -> s + "*").distinct().sorted().collect(Collectors.joining(","));
    }
    private static String otherKind() {
      final int n = IntStream.of(3, 1, 3).unordered().sum();
      return WORDS.stream().parallel().map(s -> s + n).distinct()
        .sorted().collect(Collectors.joining(","));
    }
    public static void main(String[] a) {
      System.out.printf("R %s %s %s %s %s %s%n",
        ordered(), unordered(), after(), sequential(), guarded(), otherKind());
    }
  }
grep-in: ".*"
log:
  - "Modified 1/1 X.phi"
  - "Finished rewriting 1 file"
  - "BUILD SUCCESS"
  - "R a!,bb!,ccc! a!,bb!,ccc! a?,bb?,ccc? a-,bb-,ccc- a*,bb* a7,bb7,ccc7"
before:
  invokedynamic: 13
  invokeinterface: 42
after:
  invokedynamic: 12
  invokeinterface: 53
